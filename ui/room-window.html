<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>多 AI 同室</title>
<style>
  :root{
    --bg:#14161a; --bg2:#1b1e24; --bg3:#232830; --bg4:#2c313c;
    --line:rgba(255,255,255,.09); --fg:#e8eaf0; --dim:#98a1b0; --dim2:#6d7686;
    --pri:#3b82f6; --ok:#22c55e; --warn:#eab308; --err:#ef4444;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);color:var(--fg);
    font:13.5px/1.62 system-ui,"Segoe UI","Microsoft YaHei",sans-serif;
    display:flex;flex-direction:column;overflow:hidden;
  }
  button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--bg3);color:var(--fg);
    border-radius:6px;padding:6px 12px;white-space:nowrap;flex:none}
  button:hover:not(:disabled){background:var(--bg4)}
  button:disabled{opacity:.4;cursor:not-allowed}
  button.pri{background:var(--pri);border-color:var(--pri)}
  button.pri:hover:not(:disabled){background:#2f6fd8}
  button.danger{background:rgba(239,68,68,.85);border-color:var(--err)}
  button.icon{padding:6px 9px;font-size:15px;line-height:1}

  /* ---------- 顶栏 ---------- */
  header{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--line);
    background:var(--bg2);flex:none}
  header h1{font-size:13.5px;font-weight:600;flex:none}
  #dot{width:8px;height:8px;border-radius:50%;background:#6b7280;flex:none}
  #dot.on{background:var(--ok);box-shadow:0 0 7px var(--ok)}
  #dot.run{background:var(--warn);animation:pulse 1s infinite}
  #dot.err{background:var(--err)}
  @keyframes pulse{50%{opacity:.25}}
  header .sp{flex:1}
  #status{color:var(--dim);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:36%}
  #status.bad{color:#fca5a5}

  /* ---------- 参与者 ---------- */
  #peers{display:flex;gap:7px;flex-wrap:wrap;padding:8px 14px;border-bottom:1px solid var(--line);
    background:var(--bg2);flex:none;align-items:center;min-height:44px}
  #peers .lbl{color:var(--dim2);font-size:11.5px;flex:none;margin-right:2px}
  .chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--bg3);
    border-radius:999px;padding:3px 11px;font-size:12px;cursor:pointer;user-select:none;transition:.1s}
  .chip:hover{background:var(--bg4)}
  .chip.on{background:rgba(59,130,246,.22);border-color:rgba(59,130,246,.65);color:#cfe3ff}
  .chip.now{background:rgba(234,179,8,.2);border-color:rgba(234,179,8,.6);color:#fde68a}
  .chip.dead{opacity:.4;cursor:not-allowed;text-decoration:line-through}
  .chip i{width:6px;height:6px;border-radius:50%;background:var(--dim2);flex:none}
  .chip.on i{background:var(--pri)}
  .chip .p{color:var(--dim2);font-size:10.5px}
  .chip.all{border-style:dashed}

  /* ---------- 消息 ---------- */
  #msgs{flex:1;overflow:auto;padding:14px 18px;display:flex;flex-direction:column;gap:11px}
  .empty{color:var(--dim2);text-align:center;padding:70px 20px;font-size:12.5px;line-height:1.9}

  .ev{display:flex;flex-direction:column;max-width:82%}
  .ev.me{align-self:flex-end;align-items:flex-end}
  .ev .meta{font-size:11px;color:var(--dim2);margin:0 3px 3px}
  .ev .bub{background:var(--bg2);border:1px solid var(--line);border-radius:11px;padding:8px 12px;
    white-space:pre-wrap;word-break:break-word}
  .ev.me .bub{background:rgba(59,130,246,.16);border-color:rgba(59,130,246,.42)}
  .ev.sys{align-self:center;max-width:70%}
  .ev.sys .bub{background:transparent;border:1px dashed var(--line);color:var(--dim);font-size:12px;text-align:center}
  .ev.sys.err .bub{border-color:rgba(239,68,68,.5);color:#fca5a5}
  .ev .to{font-size:11px;color:var(--dim2);margin:3px 3px 0}
  .bub .att{display:flex;gap:7px;flex-wrap:wrap;margin-top:6px}
  .bub .att img{max-width:190px;max-height:150px;border-radius:7px;border:1px solid var(--line);display:block}
  .bub .att .f{display:inline-flex;align-items:center;gap:5px;background:var(--bg3);border:1px solid var(--line);
    border-radius:6px;padding:4px 9px;font-size:12px}

  .typing{display:inline-flex;gap:3px;align-items:center;color:var(--dim);font-size:12px}
  .typing b{width:5px;height:5px;border-radius:50%;background:var(--dim);animation:tp 1.2s infinite}
  .typing b:nth-child(2){animation-delay:.2s}
  .typing b:nth-child(3){animation-delay:.4s}
  @keyframes tp{0%,60%,100%{opacity:.25}30%{opacity:1}}

  /* ---------- 附件预览 ---------- */
  #atts{display:flex;gap:8px;flex-wrap:wrap;padding:0 14px;background:var(--bg2);flex:none}
  #atts:not(:empty){padding:9px 14px;border-top:1px solid var(--line)}
  .at{position:relative;border:1px solid var(--line);border-radius:8px;background:var(--bg3);padding:5px 8px;
    display:flex;align-items:center;gap:7px;font-size:12px;max-width:230px}
  .at img{width:40px;height:40px;object-fit:cover;border-radius:5px;flex:none}
  .at .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .at .sz{color:var(--dim2);font-size:10.5px;flex:none}
  .at .x{cursor:pointer;color:var(--dim2);font-size:14px;line-height:1;flex:none;padding:0 2px}
  .at .x:hover{color:#fca5a5}
  .at.st{opacity:.55}

  /* ---------- 输入区 ---------- */
  #composer{flex:none;background:var(--bg2);border-top:1px solid var(--line);padding:10px 14px 12px;position:relative}
  #sendTo{font-size:11.5px;color:var(--dim2);margin-bottom:6px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  #sendTo .tg{cursor:pointer}
  #sendTo .tg:hover{color:#fca5a5}
  #sendTo .none{color:#fca5a5}
  .box{display:flex;gap:9px;align-items:flex-end}
  #input{
    flex:1;background:var(--bg3);color:var(--fg);border:1px solid var(--line);border-radius:9px;
    padding:9px 12px;font:inherit;font-size:13.5px;resize:none;outline:none;
    min-height:42px;max-height:190px;line-height:1.55;
  }
  #input:focus{border-color:var(--pri)}
  #input::placeholder{color:var(--dim2)}

  /* @ 下拉 */
  #mention{position:absolute;left:14px;bottom:100%;margin-bottom:6px;background:var(--bg4);border:1px solid var(--line);
    border-radius:9px;box-shadow:0 10px 30px rgba(0,0,0,.5);min-width:250px;max-height:260px;overflow:auto;display:none;z-index:20}
  #mention.show{display:block}
  #mention .it{padding:7px 12px;cursor:pointer;display:flex;align-items:center;gap:8px;font-size:12.5px}
  #mention .it:hover,#mention .it.sel{background:rgba(59,130,246,.24)}
  #mention .it .p{color:var(--dim2);font-size:10.5px;margin-left:auto}
  #mention .hd{padding:6px 12px;color:var(--dim2);font-size:10.5px;border-bottom:1px solid var(--line)}

  /* 拖拽遮罩 */
  #drop{position:fixed;inset:0;background:rgba(59,130,246,.14);border:2px dashed var(--pri);display:none;
    align-items:center;justify-content:center;font-size:17px;color:#cfe3ff;z-index:99;pointer-events:none}
  #drop.show{display:flex}

  /* 错误横幅：之前只把错误写进顶栏一行小字，用户根本注意不到，
     于是"点了发送没反应"看起来就像功能坏了。 */
  #banner{display:none;align-items:flex-start;gap:9px;padding:9px 14px;background:rgba(239,68,68,.16);
    border-bottom:1px solid rgba(239,68,68,.45);color:#fecaca;font-size:12.5px;flex:none}
  #banner.show{display:flex}
  #banner .ico{flex:none;line-height:1.4}
  #banner .txt{flex:1;word-break:break-word;line-height:1.5}
  #banner .x{cursor:pointer;color:#fca5a5;flex:none;font-size:15px;line-height:1;padding:0 2px}
  #banner .x:hover{color:#fff}

  /* 发送中：按钮上给个明确反馈 */
  button.busy{position:relative;color:transparent!important}
  button.busy::after{content:'';position:absolute;left:50%;top:50%;width:13px;height:13px;margin:-7px 0 0 -7px;
    border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  footer{flex:none;padding:5px 14px;border-top:1px solid var(--line);background:var(--bg2);
    color:var(--dim2);font-size:11px;display:flex;gap:12px}
  footer .sp{flex:1}
  kbd{background:var(--bg3);border:1px solid var(--line);border-radius:4px;padding:0 5px;font-size:10.5px;font-family:inherit}
</style>
</head>
<body>
  <header>
    <i id="dot"></i>
    <h1>多 AI 同室</h1>
    <span class="sp"></span>
    <div id="status">正在连接…</div>
    <button id="btn-refresh" class="icon" title="刷新">↻</button>
    <button id="btn-clear" class="icon" title="清空聊天记录">🗑</button>
  </header>

  <div id="peers"><span class="lbl">参与者</span></div>

  <div id="banner">
    <span class="ico">⚠</span>
    <span class="txt" id="banner-txt"></span>
    <span class="x" id="banner-x" title="关闭">✕</span>
  </div>

  <!-- ============ 聊天室 ============ -->
  <div id="msgs"><div class="empty">在下面输入消息，用 <b>@</b> 选择要发给谁（或勾选全体）。<br>可以拖入图片/文件，也可以直接粘贴截图。</div></div>

  <div id="atts"></div>

  <div id="composer">
    <div id="mention"></div>
    <div id="sendTo"></div>
    <div class="box">
      <button id="btn-attach" class="icon" title="添加图片或文件">📎</button>
      <textarea id="input" rows="1" placeholder="输入消息…  用 @ 指定对话对象（默认发给所有已勾选的人）"></textarea>
      <button id="btn-send" class="pri">发送</button>
    </div>
    <input type="file" id="filePick" multiple style="display:none">
  </div>

  <div id="drop">松手即添加到待发送附件</div>

  <footer>
    <span id="foot">—</span>
    <span class="sp"></span>
    <span><kbd>Enter</kbd> 发送 · <kbd>Shift</kbd>+<kbd>Enter</kbd> 换行 · <kbd>@</kbd> 选人</span>
  </footer>

<script>
(function () {
  'use strict';

  var TOKEN = '__ROOM_TOKEN__';
  var PORT = __ROOM_PORT__;
  var MAX_ATTACH_MB = __ROOM_MAX_ATTACH__;

  var $ = function (id) { return document.getElementById(id); };
  var dot = $('dot'), statusEl = $('status'), peersEl = $('peers'), msgsEl = $('msgs');
  var attsEl = $('atts'), inputEl = $('input'), sendToEl = $('sendTo'), mentionEl = $('mention');
  var btnSend = $('btn-send'), btnAttach = $('btn-attach'), btnRefresh = $('btn-refresh');
  var btnClear = $('btn-clear'), filePick = $('filePick'), dropEl = $('drop'), footEl = $('foot');
  var bannerEl = $('banner'), bannerTxt = $('banner-txt'), bannerX = $('banner-x');

  /** 显示一条醒目的错误；setError('') 可清除 */
  function setError(msg) {
    state.error = msg || '';
    if (msg) {
      bannerTxt.textContent = msg;
      bannerEl.className = 'show';
    } else {
      bannerEl.className = '';
      bannerTxt.textContent = '';
    }
  }
  bannerX.addEventListener('click', function () { setError(''); renderStatus(); });

  // 兜底：任何未捕获的异常都显示出来，而不是静静地失败。
  // （之前 renderStatus 抛 ReferenceError 时界面毫无提示，用户只看到"点了没反应"。）
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('error', function (e) {
      var m = (e && (e.message || (e.error && e.error.message))) || '脚本异常';
      setError('界面出错：' + m + '（请把这条信息反馈给插件作者）');
      try { renderStatus(); } catch (_) {}
    });
    window.addEventListener('unhandledrejection', function (e) {
      var r = e && e.reason;
      var m = (r && (r.message || r)) || '未知原因';
      setError('请求失败：' + m);
      try { renderStatus(); } catch (_) {}
    });
  }

  var state = {
    alive: false, error: '',
    windows: [],
    selected: {},          // windowId -> bool（发送对象）
    chat: { messages: [], busy: [], sending: false },
    attachments: [],       // {name,mime,size,data,dataUrl,status}
    mention: { open: false, idx: 0, at: -1, query: '', items: [] },
    seen: {},              // 已渲染的消息 id
    lastCount: 0
  };

  // ===================== 通信 =====================
  function api(path, opts) {
    var o = opts || {};
    return fetch('http://127.0.0.1:' + PORT + path, {
      method: o.method || 'GET',
      headers: { 'Authorization': 'Bearer ' + TOKEN, 'Content-Type': 'application/json' },
      body: o.body ? JSON.stringify(o.body) : undefined
    }).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    });
  }

  // ===================== 工具 =====================
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined && text !== null) n.textContent = String(text);
    return n;
  }
  function fmtSize(b) {
    if (b < 1024) return b + ' B';
    if (b < 1048576) return (b / 1024).toFixed(1) + ' KB';
    return (b / 1048576).toFixed(1) + ' MB';
  }
  function fmtTime(t) {
    try {
      var d = new Date(t);
      return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
    } catch (e) { return ''; }
  }
  function isImg(mime, name) {
    if (mime && /^image\//.test(mime)) return true;
    return /\.(png|jpe?g|gif|webp|bmp|svg)$/i.test(name || '');
  }
  function peers() { return state.windows.filter(function (w) { return !w.isSubagent; }); }
  function targetList() {
    var ids = Object.keys(state.selected).filter(function (k) { return state.selected[k]; });
    if (!ids.length) return peers().filter(function (w) { return w.canInject; });
    return peers().filter(function (w) { return state.selected[w.windowId] && w.canInject; });
  }

  // ===================== 渲染：参与者 =====================
  function renderPeers() {
    peersEl.textContent = '';
    peersEl.appendChild(el('span', 'lbl', '参与者'));
    if (!state.alive) { peersEl.appendChild(el('span', 'lbl', state.error || '未连接')); return; }
    var list = peers();
    if (!list.length) { peersEl.appendChild(el('span', 'lbl', '没有可用窗口')); return; }

    // 正在等谁回复，就把谁的胶囊高亮出来
    var nowId = null;
    var busyList = state.chat.busy || [];
    if (busyList.length === 1) nowId = busyList[0];

    list.forEach(function (w) {
      var c = el('span', 'chip');
      c.appendChild(el('i'));
      c.appendChild(el('span', null, w.title || w.url || ('窗口 ' + w.windowId)));
      c.appendChild(el('span', 'p', w.providerId || '?'));
      if (!w.canInject) c.className += ' dead';
      else if (state.selected[w.windowId]) c.className += ' on';
      if (w.windowId === nowId) c.className += ' now';
      if (w.canInject) {
        c.addEventListener('click', function () {
          state.selected[w.windowId] = !state.selected[w.windowId];
          renderPeers(); renderSendTo();
        });
      }
      peersEl.appendChild(c);
    });

    var allOn = list.length > 0 && list.every(function (w) { return !w.canInject || state.selected[w.windowId]; });
    var a = el('span', 'chip all' + (allOn ? ' on' : ''));
    a.appendChild(el('span', null, allOn ? '取消全体' : '全体'));
    a.addEventListener('click', function () {
      var on = !allOn;
      list.forEach(function (w) { if (w.canInject) state.selected[w.windowId] = on; });
      renderPeers(); renderSendTo();
    });
    peersEl.appendChild(a);
  }

  function renderSendTo() {
    sendToEl.textContent = '';
    var t = targetList();
    sendToEl.appendChild(el('span', null, '发送给：'));
    if (!t.length) {
      sendToEl.appendChild(el('span', 'none', '（没有可用的对话对象）'));
      return;
    }
    t.forEach(function (w) {
      var g = el('span', 'tg', '＠' + (w.title || w.providerId));
      g.title = '点击移除';
      g.addEventListener('click', function () {
        state.selected[w.windowId] = false;
        renderPeers(); renderSendTo();
      });
      sendToEl.appendChild(g);
    });
    sendToEl.appendChild(el('span', null, '（' + t.length + ' 位）'));
  }

  // ===================== 渲染：消息 =====================
  function renderMsgs() {
    var ms = state.chat.messages || [];
    // 增量：只在条数变少（清空/重置）时整体重绘
    if (ms.length < state.lastCount) { msgsEl.textContent = ''; state.seen = {}; }
    state.lastCount = ms.length;

    if (!ms.length && !state.chat.sending) {
      if (!msgsEl.querySelector('.empty')) {
        msgsEl.textContent = '';
        var e = el('div', 'empty');
        e.appendChild(el('span', null, '在下面输入消息，用 '));
        e.appendChild(el('b', null, '@'));
        e.appendChild(el('span', null, ' 选择要发给谁（或点「全体」）。'));
        e.appendChild(document.createElement('br'));
        e.appendChild(el('span', null, '可以拖入图片/文件，也可以直接粘贴截图。'));
        msgsEl.appendChild(e);
      }
      return;
    }
    var emp = msgsEl.querySelector('.empty');
    if (emp) emp.remove();

    var stick = msgsEl.scrollTop + msgsEl.clientHeight >= msgsEl.scrollHeight - 90;

    ms.forEach(function (m) {
      if (state.seen[m.id]) return;
      state.seen[m.id] = true;
      msgsEl.appendChild(buildMsg(m));
    });

    // 运行态提示
    var old = msgsEl.querySelector('.running');
    if (old) old.remove();
    var busy = (state.chat.busy || []).length;
    if (state.chat.sending || busy) {
      var r = el('div', 'ev sys running');
      var b = el('div', 'bub');
      var tp = el('span', 'typing');
      tp.appendChild(el('span', null, busy ? ('正在等待 ' + busy + ' 位回复') : '正在发送'));
      tp.appendChild(el('b')); tp.appendChild(el('b')); tp.appendChild(el('b'));
      b.appendChild(tp);
      r.appendChild(b);
      msgsEl.appendChild(r);
    }
    if (stick || ms.length !== state.lastCount) msgsEl.scrollTop = msgsEl.scrollHeight;
  }

  function buildMsg(m) {
    if (m.role === 'system') {
      var s = el('div', 'ev sys' + (m.err ? ' err' : ''));
      s.appendChild(el('div', 'bub', m.text));
      return s;
    }
    var me = m.role === 'user';
    var d = el('div', 'ev ' + (me ? 'me' : 'ai'));
    var meta = (m.who || (me ? '我' : 'AI')) + ' · ' + fmtTime(m.at);
    d.appendChild(el('div', 'meta', meta));
    var bub = el('div', 'bub');
    bub.appendChild(el('span', null, m.text || ''));

    if (m.attach && m.attach.length) {
      var box = el('div', 'att');
      m.attach.forEach(function (a) {
        if (a.dataUrl && isImg(a.mime, a.name)) {
          var im = el('img');
          im.src = a.dataUrl;
          im.title = a.name;
          box.appendChild(im);
        } else {
          var f = el('span', 'f', '📄 ' + a.name);
          box.appendChild(f);
        }
      });
      bub.appendChild(box);
    }
    d.appendChild(bub);

    if (me && m.targets && m.targets.length) {
      d.appendChild(el('div', 'to', '→ ' + m.targets.map(function (t) { return t.label; }).join('、')
        + (m.mode === 'sequential' ? '（顺序发言）' : '')));
    }
    return d;
  }

  // ===================== 渲染：附件 =====================
  function renderAtts() {
    attsEl.textContent = '';
    state.attachments.forEach(function (a, i) {
      var d = el('div', 'at' + (a.status === 'sending' ? ' st' : ''));
      if (a.dataUrl && isImg(a.mime, a.name)) {
        var im = el('img');
        im.src = a.dataUrl;
        d.appendChild(im);
      } else {
        d.appendChild(el('span', null, '📄'));
      }
      var nm = el('span', 'nm', a.name);
      nm.title = a.name;
      d.appendChild(nm);
      d.appendChild(el('span', 'sz', fmtSize(a.size)));
      if (a.status !== 'sending') {
        var x = el('span', 'x', '✕');
        x.title = '移除';
        x.addEventListener('click', function () { state.attachments.splice(i, 1); renderAtts(); });
        d.appendChild(x);
      }
      attsEl.appendChild(d);
    });
  }

  function addFiles(files) {
    var arr = Array.prototype.slice.call(files || []);
    for (var i = 0; i < arr.length; i++) {
      (function (f) {
        if (f.size > MAX_ATTACH_MB * 1024 * 1024) {
          setError('「' + f.name + '」超过 ' + MAX_ATTACH_MB + 'MB 上限');
          renderStatus(); return;
        }
        var fr = new FileReader();
        fr.onload = function () {
          var s = String(fr.result);
          var k = s.indexOf(',');
          state.attachments.push({
            name: f.name || ('粘贴的图片.' + (f.type.split('/')[1] || 'png')),
            mime: f.type || 'application/octet-stream',
            size: f.size,
            data: k >= 0 ? s.slice(k + 1) : s,
            dataUrl: s,
            status: 'ready'
          });
          renderAtts();
        };
        fr.onerror = function () { setError('读取「' + f.name + '」失败'); renderStatus(); };
        fr.readAsDataURL(f);
      })(arr[i]);
    }
  }

  // ===================== @ 提及 =====================
  function openMention(query) {
    var list = [];
    var t = targetList();
    var pool = t.length ? t : peers().filter(function (w) { return w.canInject; });
    list.push({ id: 'all', label: '全体', plat: '发给所有已勾选的人' });
    pool.forEach(function (w) {
      list.push({ id: String(w.windowId), label: w.title || w.providerId || ('窗口 ' + w.windowId), plat: w.providerId || '' });
    });
    if (query) {
      var q = query.toLowerCase();
      list = list.filter(function (x) {
        if (x.id === 'all') return '全体 all'.indexOf(q) >= 0 || '全体'.indexOf(query) >= 0;
        return String(x.label).toLowerCase().indexOf(q) >= 0 || String(x.plat).toLowerCase().indexOf(q) >= 0;
      });
    }
    state.mention.items = list;
    state.mention.query = query || '';
    state.mention.idx = 0;
    state.mention.open = list.length > 0;
    renderMention();
  }

  function closeMention() {
    state.mention.open = false;
    mentionEl.className = '';
    mentionEl.textContent = '';
  }

  function renderMention() {
    if (!state.mention.open) { closeMention(); return; }
    mentionEl.textContent = '';
    var hd = el('div', 'hd', state.mention.query
      ? ('匹配「' + state.mention.query + '」')
      : '选择对话对象（↑↓ 选择，Enter 确认，Esc 取消）');
    mentionEl.appendChild(hd);
    state.mention.items.forEach(function (it, i) {
      var d = el('div', 'it' + (i === state.mention.idx ? ' sel' : ''));
      d.appendChild(el('span', null, (it.id === 'all' ? '👥 ' : '🤖 ') + it.label));
      d.appendChild(el('span', 'p', it.plat));
      d.addEventListener('mousedown', function (e) { e.preventDefault(); chooseMention(i); });
      mentionEl.appendChild(d);
    });
    mentionEl.className = 'show';
  }

  function detectMention() {
    var v = inputEl.value;
    var pos = inputEl.selectionStart;
    var before = v.slice(0, pos);
    var at = before.lastIndexOf('@');
    if (at < 0) { closeMention(); return; }
    var frag = before.slice(at + 1);
    if (/[\s\n]/.test(frag)) { closeMention(); return; }
    state.mention.at = at;
    openMention(frag);
  }

  function chooseMention(i) {
    var it = state.mention.items[i];
    if (!it) return;
    var v = inputEl.value;
    var at = state.mention.at;
    var pos = inputEl.selectionStart;
    // 用 @名字 替换掉打了一半的片段
    var insert = '@' + it.label + ' ';
    inputEl.value = v.slice(0, at) + insert + v.slice(pos);
    var np = at + insert.length;
    try { inputEl.setSelectionRange(np, np); } catch (e) {}

    if (it.id === 'all') {
      peers().forEach(function (w) { if (w.canInject) state.selected[w.windowId] = true; });
    } else {
      // 只发给被 @ 到的人
      peers().forEach(function (w) { state.selected[w.windowId] = false; });
      state.selected[Number(it.id)] = true;
    }
    closeMention();
    renderPeers(); renderSendTo();
  }

  // ===================== 状态栏 =====================
  function renderStatus() {
    var busy = (state.chat.busy || []).length;
    var working = !!(state.chat.sending || busy);
    dot.className = state.alive ? (working ? 'run' : 'on') : 'err';
    if (!state.alive) {
      statusEl.className = 'bad';
      statusEl.textContent = state.error || '未连接主进程服务';
    } else if (state.error) {
      statusEl.className = 'bad';
      statusEl.textContent = state.error;
    } else if (busy) {
      statusEl.className = '';
      statusEl.textContent = '等待 ' + busy + ' 位回复…';
    } else if (state.chat.sending) {
      statusEl.className = '';
      statusEl.textContent = '正在发送…';
    } else {
      statusEl.className = '';
      statusEl.textContent = '就绪';
    }
    btnSend.disabled = !state.alive;
    var t = targetList();
    footEl.textContent = '已选 ' + t.length + ' 位 · 记录 ' + (state.chat.messages || []).length + ' 条 · 端口 ' + PORT;
  }

  function renderAll() { renderPeers(); renderSendTo(); renderMsgs(); renderAtts(); renderStatus(); }

  // ===================== 拉取 =====================
  function pullStatus() {
    return api('/status').then(function (r) {
      state.alive = true;
      state.windows = r.windows || [];
      if (r.port) PORT = r.port;
      if (!Object.keys(state.selected).length) {
        peers().forEach(function (w) { if (w.canInject) state.selected[w.windowId] = true; });
      }
    }, function (e) {
      state.alive = false;
      // 这里不用横幅：断连时顶栏已经是红的，每次轮询都弹横幅会刷屏
      state.error = '连不上主进程服务（端口 ' + PORT + '）：' + ((e && e.message) || e)
        + ' —— 若刚装好插件，请重启 Cuckoo';
      state.windows = [];
    });
  }
  function pullChat() {
    return api('/chat/status').then(function (r) {
      state.chat = r.chat || state.chat;
      state.alive = true;
    }, function () {});
  }
  function refresh() {
    return pullStatus().then(pullChat).then(renderAll, renderAll);
  }

  // ===================== 发送 =====================
  function send() {
    var text = inputEl.value.trim();
    if (!text && !state.attachments.length) return;
    if (!text && state.attachments.length) text = '（请查看附件）';
    var t = targetList();
    if (!t.length) { setError('没有可用的对话对象：请打开至少一个 AI 平台窗口'); renderStatus(); return; }

    var payload = {
      text: text,
      targets: t.map(function (w) { return w.windowId; }),
      mode: 'parallel',
      files: state.attachments.map(function (a) {
        return { name: a.name, mime: a.mime, data: a.data };
      })
    };

    // 先做完全部可能抛错的事（含渲染），再清空输入框并发请求。
    // 顺序很重要：以前 renderStatus() 抛错会把输入框内容留在界面上，
    // 用户看到的就是"点了发送，字还在，什么都没发生"。
    setError('');
    btnSend.disabled = true;
    btnSend.className = 'pri busy';
    var hadAtts = state.attachments.length > 0;

    api('/chat/send', { method: 'POST', body: payload }).then(function (r) {
      if (!r || !r.ok) {
        setError((r && r.error) || '发送失败');
        return;                       // 失败则不清空输入框，让用户能重试
      }
      if (r.failed && r.failed.length) {
        setError('有 ' + r.failed.length + ' 个附件未上传成功，文字已发出。'
          + r.failed.map(function (f) { return '「' + f.name + '」' + (f.target ? ('→' + f.target) : '') + '：' + f.error; }).join('；'));
      }
      // 只有确认成功才清空输入与附件
      inputEl.value = '';
      inputEl.style.height = 'auto';
      state.attachments = [];
      renderAtts();
      return refresh();
    }, function (e) {
      setError('发送失败：' + ((e && e.message) || e)
        + '（若服务未启动，请重启 Cuckoo 让插件重新加载）');
    }).then(function () {
      btnSend.disabled = false;
      btnSend.className = 'pri';
      renderStatus();
    });
  }

  // ===================== 事件 =====================
  btnSend.addEventListener('click', send);

  inputEl.addEventListener('input', function () {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(190, inputEl.scrollHeight) + 'px';
    detectMention();
  });

  inputEl.addEventListener('keydown', function (e) {
    if (state.mention.open) {
      if (e.key === 'ArrowDown') { e.preventDefault(); state.mention.idx = (state.mention.idx + 1) % state.mention.items.length; renderMention(); return; }
      if (e.key === 'ArrowUp') { e.preventDefault(); state.mention.idx = (state.mention.idx - 1 + state.mention.items.length) % state.mention.items.length; renderMention(); return; }
      if (e.key === 'Enter' || e.key === 'Tab') { e.preventDefault(); chooseMention(state.mention.idx); return; }
      if (e.key === 'Escape') { e.preventDefault(); closeMention(); return; }
    }
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      send();
    }
  });

  // 粘贴图片/文件
  inputEl.addEventListener('paste', function (e) {
    var items = (e.clipboardData && e.clipboardData.items) || [];
    var files = [];
    for (var i = 0; i < items.length; i++) {
      if (items[i].kind === 'file') {
        var f = items[i].getAsFile();
        if (f) files.push(f);
      }
    }
    if (files.length) { e.preventDefault(); addFiles(files); }
  });

  btnAttach.addEventListener('click', function () { filePick.click(); });
  filePick.addEventListener('change', function () { addFiles(filePick.files); filePick.value = ''; });

  var dragDepth = 0;
  window.addEventListener('dragenter', function (e) {
    if (!e.dataTransfer || Array.prototype.indexOf.call(e.dataTransfer.types || [], 'Files') < 0) return;
    e.preventDefault(); dragDepth++; dropEl.className = 'show';
  });
  window.addEventListener('dragover', function (e) {
    if (e.dataTransfer && Array.prototype.indexOf.call(e.dataTransfer.types || [], 'Files') >= 0) e.preventDefault();
  });
  window.addEventListener('dragleave', function () { dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) dropEl.className = ''; });
  window.addEventListener('drop', function (e) {
    e.preventDefault(); dragDepth = 0; dropEl.className = '';
    if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) addFiles(e.dataTransfer.files);
  });

  btnRefresh.addEventListener('click', function () { refresh(); });
  btnClear.addEventListener('click', function () {
    if (!confirm('清空聊天记录？')) return;
    api('/chat/clear', { method: 'POST' }).then(refresh, refresh);
  });

  // ===================== 轮询 =====================
  refresh();
  setInterval(function () {
    pullStatus().then(pullChat).then(function () {
      renderPeers(); renderSendTo(); renderMsgs(); renderStatus();
    }, function () {});
  }, 1500);
})();
</script>
</body>
</html>
