<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>多 AI 同室</title>
<style>
  /* ==========================================================================
     配色：跟随 Cuckoo 应用主题（主进程经 /status 的 theme 字段下发，页面每 1.5s 轮询）
     层次用「表面」区分，而不是靠 1px 边框硬切：
       chrome（顶栏/参与者栏/底栏）最沉 → canvas（消息区）最舒适 → card（气泡/输入）抬起
     ========================================================================== */
  :root{
    --chrome:#0f1115;
    --canvas:#15181e;
    --card:#1e2229;
    --card-2:#252a33;
    --hover:#2b313b;
    --line:rgba(255,255,255,.07);
    --line-2:rgba(255,255,255,.13);
    --fg:#e6e9ef;
    --fg-2:#a3aab8;
    --fg-3:#6f7684;
    --pri:#6b83ff;
    --pri-fg:#fff;
    --pri-soft:rgba(107,131,255,.16);
    --self-bg:rgba(107,131,255,.14);
    --self-line:rgba(107,131,255,.34);
    --ok:#3fbf7f;
    --warn:#e0a92e;
    --err:#f0605f;
    --err-bg:rgba(240,96,95,.13);
    --err-line:rgba(240,96,95,.4);
    --code-bg:rgba(0,0,0,.32);
    --id-sat:58%;
    --id-light:54%;
    --shadow:0 1px 2px rgba(0,0,0,.24);
    --shadow-lg:0 8px 28px rgba(0,0,0,.45);
    --radius:10px;
  }
  :root.light{
    --chrome:#eceef2;
    --canvas:#f7f8fa;
    --card:#ffffff;
    --card-2:#f1f3f7;
    --hover:#e6e9ef;
    --line:rgba(16,24,40,.08);
    --line-2:rgba(16,24,40,.15);
    --fg:#16181d;
    --fg-2:#545a67;
    --fg-3:#8a8f9b;
    --pri:#4d6bfe;
    --pri-soft:rgba(77,107,254,.1);
    --self-bg:rgba(77,107,254,.09);
    --self-line:rgba(77,107,254,.3);
    --ok:#30a46c;
    --warn:#b8860b;
    --err:#e5484d;
    --err-bg:rgba(229,72,77,.08);
    --err-line:rgba(229,72,77,.3);
    --code-bg:rgba(16,24,40,.055);
    --id-sat:52%;
    --id-light:46%;
    --shadow:0 1px 2px rgba(16,24,40,.05);
    --shadow-lg:0 8px 28px rgba(16,24,40,.12);
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--canvas);color:var(--fg);
    font:13.5px/1.62 system-ui,"Segoe UI","Microsoft YaHei",sans-serif;
    display:flex;flex-direction:column;overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:5px;border:2px solid transparent;background-clip:content-box}
  ::-webkit-scrollbar-thumb:hover{background:var(--fg-3);background-clip:content-box}
  ::-webkit-scrollbar-track{background:transparent}

  button{font:inherit;cursor:pointer;border:1px solid var(--line-2);background:var(--card);
    color:var(--fg);border-radius:7px;padding:6px 12px;white-space:nowrap;flex:none;transition:.13s}
  button:hover:not(:disabled){background:var(--hover)}
  button:disabled{opacity:.38;cursor:not-allowed}
  button.pri{background:var(--pri);border-color:var(--pri);color:var(--pri-fg);font-weight:500}
  button.pri:hover:not(:disabled){filter:brightness(1.1)}
  button.icon{padding:5px 8px;font-size:14px;line-height:1.2;background:transparent;border-color:transparent;color:var(--fg-2)}
  button.icon:hover:not(:disabled){background:var(--hover);color:var(--fg)}

  /* ---------- 顶栏（chrome） ---------- */
  header{display:flex;align-items:center;gap:9px;padding:9px 14px;background:var(--chrome);
    border-bottom:1px solid var(--line);flex:none}
  header h1{font-size:13px;font-weight:600;flex:none;letter-spacing:.2px}
  #dot{width:7px;height:7px;border-radius:50%;background:var(--fg-3);flex:none;transition:.2s}
  #dot.on{background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 22%,transparent)}
  #dot.run{background:var(--warn);animation:pulse 1.1s ease-in-out infinite}
  #dot.err{background:var(--err)}
  @keyframes pulse{50%{opacity:.28}}
  header .sp{flex:1}
  #status{color:var(--fg-2);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40%}
  #status.bad{color:var(--err)}

  /* ---------- 错误横幅 ---------- */
  #banner{display:none;align-items:flex-start;gap:9px;padding:9px 14px;background:var(--err-bg);
    border-bottom:1px solid var(--err-line);color:var(--err);font-size:12.5px;flex:none}
  #banner.show{display:flex}
  #banner .ico{flex:none;line-height:1.4}
  #banner .txt{flex:1;word-break:break-word;line-height:1.5}
  #banner .x{cursor:pointer;opacity:.7;flex:none;font-size:14px;line-height:1;padding:0 2px}
  #banner .x:hover{opacity:1}

  /* ---------- 参与者（chrome） ---------- */
  #peers{display:flex;gap:7px;flex-wrap:wrap;padding:8px 14px;background:var(--chrome);
    border-bottom:1px solid var(--line);flex:none;align-items:center;min-height:42px}
  #peers .lbl{color:var(--fg-3);font-size:11px;flex:none;letter-spacing:.3px}
  .chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--card);
    border-radius:999px;padding:3px 11px 3px 7px;font-size:12px;cursor:pointer;user-select:none;transition:.13s}
  .chip:hover{background:var(--hover)}
  .chip .av{width:16px;height:16px;border-radius:5px;display:flex;align-items:center;justify-content:center;
    font-size:9.5px;font-weight:700;color:#fff;flex:none;background:hsl(var(--id-h) var(--id-sat) var(--id-light))}
  .chip .nm{max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .chip .p{color:var(--fg-3);font-size:10px}
  .chip:not(.on){opacity:.5}
  .chip.on{border-color:var(--line-2)}
  .chip.now{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 12%,var(--card))}
  .chip.dead{opacity:.35;cursor:not-allowed}
  .chip.all{border-style:dashed;padding:3px 11px}
  .chip.all.on{border-style:solid;border-color:var(--pri);background:var(--pri-soft)}

  /* ---------- 消息区（canvas） ---------- */
  #msgs{flex:1;overflow:auto;padding:18px 20px 10px;display:flex;flex-direction:column;gap:2px}
  .empty{color:var(--fg-3);text-align:center;padding:64px 20px;font-size:12.5px;line-height:2}
  .empty b{color:var(--pri);font-weight:600}
  .empty kbd{background:var(--card);border:1px solid var(--line-2);border-radius:4px;padding:1px 6px;
    font-size:11px;font-family:inherit;color:var(--fg-2)}

  /* 日期/时间分隔 */
  .daysep{display:flex;align-items:center;gap:10px;color:var(--fg-3);font-size:11px;margin:14px 0 10px}
  .daysep::before,.daysep::after{content:'';flex:1;height:1px;background:var(--line)}

  /* 一条消息 */
  .ev{display:flex;gap:10px;padding:5px 0;max-width:100%}
  .ev.me{flex-direction:row-reverse}
  .ev .av{width:28px;height:28px;border-radius:8px;flex:none;margin-top:3px;
    display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;
    background:hsl(var(--id-h) var(--id-sat) var(--id-light));user-select:none}
  .ev .col{min-width:0;max-width:min(760px,78%)}
  .ev .hd{display:flex;align-items:baseline;gap:7px;margin-bottom:3px}
  .ev.me .hd{flex-direction:row-reverse}
  .ev .who{font-size:12px;font-weight:600;color:hsl(var(--id-h) var(--id-sat) calc(var(--id-light) + 8%))}
  :root.light .ev .who{color:hsl(var(--id-h) var(--id-sat) calc(var(--id-light) - 6%))}
  .ev .tm{font-size:10.5px;color:var(--fg-3);opacity:0;transition:opacity .15s}
  .ev:hover .tm{opacity:1}

  .ev .bub{background:var(--card);border-radius:4px 12px 12px 12px;padding:9px 13px;
    box-shadow:var(--shadow);overflow-wrap:break-word;word-break:break-word}
  .ev.me .bub{background:var(--self-bg);border:1px solid var(--self-line);border-radius:12px 4px 12px 12px}
  /* 连续同一人：收起头像与抬头，视觉上连成一组 */
  .ev.tail{padding-top:1px}
  .ev.tail .av,.ev.tail .hd{visibility:hidden;height:0;margin:0;overflow:hidden}
  .ev.tail .bub{border-radius:12px}

  /* 系统/错误 */
  .ev.sys{justify-content:center;padding:6px 0}
  .ev.sys .bub{background:transparent;box-shadow:none;color:var(--fg-3);font-size:11.5px;
    text-align:center;border:1px dashed var(--line-2);border-radius:999px;padding:3px 12px;max-width:70%}
  .ev.sys.err .bub{border-color:var(--err-line);color:var(--err);border-style:solid;background:var(--err-bg)}

  /* 发送去向 */
  .ev .to{font-size:10.5px;color:var(--fg-3);margin-top:4px;display:flex;align-items:center;gap:5px}
  .ev.me .to{justify-content:flex-end}
  .ev .to .ic{opacity:.7}

  /* ---------- Markdown ---------- */
  .md>*:first-child{margin-top:0}
  .md>*:last-child{margin-bottom:0}
  .md p{margin:0 0 .55em}
  .md h1,.md h2,.md h3,.md h4,.md h5,.md h6{margin:.9em 0 .45em;line-height:1.35;font-weight:650}
  .md h1{font-size:1.42em}
  .md h2{font-size:1.26em}
  .md h3{font-size:1.12em}
  .md h4,.md h5,.md h6{font-size:1em}
  .md ul,.md ol{margin:.4em 0 .6em;padding-left:1.5em}
  .md li{margin:.16em 0}
  .md li>ul,.md li>ol{margin:.16em 0}
  .md a{color:var(--pri);text-decoration:none;border-bottom:1px solid color-mix(in srgb,var(--pri) 40%,transparent)}
  .md a:hover{border-bottom-color:var(--pri)}
  .md strong{font-weight:650}
  .md code{font-family:ui-monospace,"Cascadia Code",Consolas,"Courier New",monospace;font-size:.9em;
    background:var(--code-bg);padding:.12em .38em;border-radius:4px}
  .md pre{background:var(--code-bg);border-radius:8px;padding:10px 12px;overflow:auto;margin:.55em 0;
    border:1px solid var(--line)}
  .md pre code{background:none;padding:0;font-size:12.5px;line-height:1.55}
  .md blockquote{border-left:3px solid var(--line-2);padding:.1em 0 .1em .85em;margin:.55em 0;color:var(--fg-2)}
  .md hr{border:none;border-top:1px solid var(--line);margin:.9em 0}
  .md table{border-collapse:collapse;margin:.55em 0;font-size:12.5px;display:block;overflow:auto;max-width:100%}
  .md th,.md td{border:1px solid var(--line-2);padding:5px 10px;text-align:left}
  .md th{background:var(--card-2);font-weight:600}
  .md img{max-width:100%;border-radius:6px}

  /* ---------- 附件（消息内） ---------- */
  .bub .att{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .bub .att img{max-width:210px;max-height:160px;border-radius:8px;display:block;cursor:zoom-in;
    border:1px solid var(--line-2)}
  .bub .att .f{display:inline-flex;align-items:center;gap:6px;background:var(--card-2);
    border:1px solid var(--line);border-radius:7px;padding:5px 10px;font-size:12px}

  /* ---------- 等待指示 ---------- */
  .typing{display:inline-flex;gap:4px;align-items:center;color:var(--fg-2);font-size:12px}
  .typing b{width:5px;height:5px;border-radius:50%;background:currentColor;animation:tp 1.3s infinite}
  .typing b:nth-child(2){animation-delay:.18s}
  .typing b:nth-child(3){animation-delay:.36s}
  @keyframes tp{0%,60%,100%{opacity:.22}30%{opacity:1}}

  /* ---------- 流式输出 ---------- */
  /* 正在生成的气泡：左边一条流动的光带，末尾一个光标 */
  .ev.streaming .bub{position:relative;overflow:hidden}
  .ev.streaming .bub::before{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;
    background:linear-gradient(180deg,transparent,var(--pri),transparent);
    animation:flow 1.4s linear infinite}
  @keyframes flow{0%{transform:translateY(-100%)}100%{transform:translateY(100%)}}
  .cursor{display:inline-block;width:2px;height:1.05em;vertical-align:-.16em;margin-left:2px;
    background:var(--pri);animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .stream-dots{display:inline-flex;gap:3px;align-items:center;margin-left:7px;vertical-align:middle}
  .stream-dots i{width:4px;height:4px;border-radius:50%;background:var(--pri);animation:tp 1.1s infinite}
  .stream-dots i:nth-child(2){animation-delay:.15s}
  .stream-dots i:nth-child(3){animation-delay:.3s}
  /* SSE 连接状态：断了会退回轮询，给用户一个可见交代 */
  #sse{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;color:var(--fg-3);flex:none;
    cursor:default;user-select:none}
  #sse i{width:5px;height:5px;border-radius:50%;background:var(--fg-3);flex:none}
  #sse.on i{background:var(--ok)}
  #sse.off i{background:var(--warn)}

  /* ---------- 附件预览区 ---------- */
  #atts{display:flex;gap:8px;flex-wrap:wrap;padding:0 14px;background:var(--chrome);flex:none}
  #atts:not(:empty){padding:10px 14px;border-top:1px solid var(--line)}
  .at{position:relative;border:1px solid var(--line-2);border-radius:9px;background:var(--card);
    padding:5px 8px;display:flex;align-items:center;gap:8px;font-size:12px;max-width:240px}
  .at img{width:40px;height:40px;object-fit:cover;border-radius:6px;flex:none}
  .at .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .at .sz{color:var(--fg-3);font-size:10.5px;flex:none}
  .at .x{cursor:pointer;color:var(--fg-3);font-size:13px;line-height:1;flex:none;padding:0 2px}
  .at .x:hover{color:var(--err)}
  .at.st{opacity:.5}

  /* ---------- 输入区（chrome + 卡片） ---------- */
  #composer{flex:none;background:var(--chrome);border-top:1px solid var(--line);padding:10px 14px 11px;position:relative}
  #sendTo{font-size:11px;color:var(--fg-3);margin-bottom:7px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  #sendTo .tg{cursor:pointer;background:var(--card);border:1px solid var(--line-2);border-radius:999px;
    padding:1px 9px;color:var(--fg-2);transition:.12s}
  #sendTo .tg:hover{color:var(--err);border-color:var(--err-line)}
  #sendTo .none{color:var(--err)}
  .box{display:flex;gap:8px;align-items:flex-end;background:var(--card);border:1px solid var(--line-2);
    border-radius:var(--radius);padding:6px 8px;transition:border-color .15s,box-shadow .15s}
  .box:focus-within{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-soft)}
  #input{
    flex:1;background:transparent;color:var(--fg);border:none;outline:none;
    padding:6px 4px;font:inherit;font-size:13.5px;resize:none;
    min-height:30px;max-height:200px;line-height:1.58;
  }
  #input::placeholder{color:var(--fg-3)}
  .box .sendbtn{background:var(--pri);border-color:var(--pri);color:var(--pri-fg);border-radius:8px;
    padding:6px 15px;font-weight:500}
  .box .sendbtn:hover:not(:disabled){filter:brightness(1.1)}

  /* @ 下拉 */
  #mention{position:absolute;left:14px;bottom:100%;margin-bottom:8px;background:var(--card);
    border:1px solid var(--line-2);border-radius:var(--radius);box-shadow:var(--shadow-lg);
    min-width:260px;max-height:280px;overflow:auto;display:none;z-index:20;padding:4px}
  #mention.show{display:block}
  #mention .it{padding:7px 10px;cursor:pointer;display:flex;align-items:center;gap:9px;font-size:12.5px;
    border-radius:7px}
  #mention .it:hover,#mention .it.sel{background:var(--pri-soft)}
  #mention .it .av{width:20px;height:20px;border-radius:6px;display:flex;align-items:center;justify-content:center;
    font-size:10px;font-weight:700;color:#fff;flex:none;background:hsl(var(--id-h) var(--id-sat) var(--id-light))}
  #mention .it .p{color:var(--fg-3);font-size:10.5px;margin-left:auto}
  #mention .hd{padding:6px 10px;color:var(--fg-3);font-size:10.5px;border-bottom:1px solid var(--line);margin-bottom:4px}

  /* 拖拽遮罩 */
  #drop{position:fixed;inset:0;background:color-mix(in srgb,var(--pri) 12%,transparent);
    border:2px dashed var(--pri);display:none;align-items:center;justify-content:center;
    font-size:16px;color:var(--pri);z-index:99;pointer-events:none;font-weight:500}
  #drop.show{display:flex}

  /* 图片灯箱 */
  #lightbox{position:fixed;inset:0;background:rgba(0,0,0,.82);display:none;align-items:center;
    justify-content:center;z-index:200;cursor:zoom-out;padding:40px}
  #lightbox.show{display:flex}
  #lightbox img{max-width:100%;max-height:100%;border-radius:8px;box-shadow:var(--shadow-lg)}

  button.busy{position:relative;color:transparent!important}
  button.busy::after{content:'';position:absolute;left:50%;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;
    border:2px solid rgba(255,255,255,.32);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  footer{flex:none;padding:5px 14px;background:var(--chrome);border-top:1px solid var(--line);
    color:var(--fg-3);font-size:10.5px;display:flex;gap:12px;align-items:center}
  footer .sp{flex:1}
  kbd{background:var(--card);border:1px solid var(--line-2);border-radius:4px;padding:0 5px;
    font-size:10px;font-family:inherit;color:var(--fg-2)}
</style>
</head>
<body>
  <header>
    <i id="dot"></i>
    <h1>多 AI 同室</h1>
    <span class="sp"></span>
    <div id="sse" class="off" title="流式输出连接状态"><i></i><span id="sse-txt">连接中</span></div>
    <div id="status">正在连接…</div>
    <button id="btn-refresh" class="icon" title="刷新">↻</button>
    <button id="btn-clear" class="icon" title="清空聊天记录">🗑</button>
  </header>

  <div id="peers"><span class="lbl">参与者</span></div>

  <div id="banner">
    <span class="ico">⚠</span>
    <span class="txt" id="banner-txt"></span>
    <span class="x" id="banner-x" title="关闭">✕</span>
  </div>

  <div id="msgs"></div>

  <div id="atts"></div>

  <div id="composer">
    <div id="mention"></div>
    <div id="sendTo"></div>
    <div class="box">
      <button id="btn-attach" class="icon" title="添加图片或文件">📎</button>
      <textarea id="input" rows="1" placeholder="输入消息…  用 @ 指定对话对象，Enter 发送"></textarea>
      <button id="btn-send" class="sendbtn">发送</button>
    </div>
    <input type="file" id="filePick" multiple style="display:none">
  </div>

  <div id="drop">松手即添加到待发送附件</div>
  <div id="lightbox"><img id="lightbox-img" alt=""></div>

  <footer>
    <span id="foot">—</span>
    <span class="sp"></span>
    <span><kbd>Enter</kbd> 发送 · <kbd>Shift</kbd>+<kbd>Enter</kbd> 换行 · <kbd>@</kbd> 选人</span>
  </footer>

<script src="/vendor/marked.umd.js"></script>
<script>
(function () {
  'use strict';

  var TOKEN = '__ROOM_TOKEN__';
  var PORT = __ROOM_PORT__;
  var MAX_ATTACH_MB = __ROOM_MAX_ATTACH__;

  var $ = function (id) { return document.getElementById(id); };
  var dot = $('dot'), statusEl = $('status'), peersEl = $('peers'), msgsEl = $('msgs');
  var attsEl = $('atts'), inputEl = $('input'), sendToEl = $('sendTo'), mentionEl = $('mention');
  var btnSend = $('btn-send'), btnAttach = $('btn-attach'), btnRefresh = $('btn-refresh');
  var btnClear = $('btn-clear'), filePick = $('filePick'), dropEl = $('drop'), footEl = $('foot');
  var bannerEl = $('banner'), bannerTxt = $('banner-txt'), bannerX = $('banner-x');
  var lightbox = $('lightbox'), lightboxImg = $('lightbox-img');
  var sseEl = $('sse'), sseTxt = $('sse-txt');

  function setError(msg) {
    state.error = msg || '';
    if (msg) { bannerTxt.textContent = msg; bannerEl.className = 'show'; }
    else { bannerEl.className = ''; bannerTxt.textContent = ''; }
  }
  bannerX.addEventListener('click', function () { setError(''); renderStatus(); });

  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('error', function (e) {
      var m = (e && (e.message || (e.error && e.error.message))) || '脚本异常';
      setError('界面出错：' + m + '（请把这条信息反馈给插件作者）');
      try { renderStatus(); } catch (_) {}
    });
    window.addEventListener('unhandledrejection', function (e) {
      var r = e && e.reason;
      setError('请求失败：' + ((r && (r.message || r)) || '未知原因'));
      try { renderStatus(); } catch (_) {}
    });
  }

  var state = {
    alive: false, error: '',
    windows: [],
    selected: {},
    chat: { messages: [], busy: [], sending: false },
    attachments: [],
    mention: { open: false, idx: 0, at: -1, query: '', items: [] },
    seen: {},
    lastCount: 0,
    theme: 'dark',
    // 流式：windowId → { text, label }，由 SSE 推送维护
    streams: {},
    sse: 'off',
  };

  // ===================== 通信 =====================
  function api(path, opts) {
    var o = opts || {};
    return fetch('http://127.0.0.1:' + PORT + path, {
      method: o.method || 'GET',
      headers: { 'Authorization': 'Bearer ' + TOKEN, 'Content-Type': 'application/json' },
      body: o.body ? JSON.stringify(o.body) : undefined
    }).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    });
  }

  // ===================== 工具 =====================
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined && text !== null) n.textContent = String(text);
    return n;
  }
  function fmtSize(b) {
    if (b < 1024) return b + ' B';
    if (b < 1048576) return (b / 1024).toFixed(1) + ' KB';
    return (b / 1048576).toFixed(1) + ' MB';
  }
  function fmtTime(t) {
    try {
      var d = new Date(t);
      return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
    } catch (e) { return ''; }
  }
  function fmtDay(t) {
    try {
      var d = new Date(t), n = new Date();
      var same = d.toDateString() === n.toDateString();
      if (same) return '今天';
      var y = new Date(n.getTime() - 86400000);
      if (d.toDateString() === y.toDateString()) return '昨天';
      return (d.getMonth() + 1) + '月' + d.getDate() + '日';
    } catch (e) { return ''; }
  }
  function isImg(mime, name) {
    if (mime && /^image\//.test(mime)) return true;
    return /\.(png|jpe?g|gif|webp|bmp|svg)$/i.test(name || '');
  }
  function peers() { return state.windows.filter(function (w) { return !w.isSubagent; }); }
  function targetList() {
    var ids = Object.keys(state.selected).filter(function (k) { return state.selected[k]; });
    if (!ids.length) return peers().filter(function (w) { return w.canInject; });
    return peers().filter(function (w) { return state.selected[w.windowId] && w.canInject; });
  }

  /** 身份色：由 windowId 稳定派生一个色相，写进 --id-h 交给 CSS 计算明度 */
  function hueOf(id) {
    var HUES = [212, 158, 276, 24, 338, 190, 44, 118, 258, 6];
    var n = Number(id);
    if (!isFinite(n)) n = String(id || '').split('').reduce(function (a, c) { return a + c.charCodeAt(0); }, 0);
    return HUES[Math.abs(n) % HUES.length];
  }
  function initialOf(label) {
    var s = String(label || '?').trim();
    var m = s.match(/[\u4e00-\u9fa5]/);
    if (m) return m[0];
    return (s.charAt(0) || '?').toUpperCase();
  }

  // ===================== Markdown（白名单重建式消毒） =====================
  /**
   * AI 的回复是**第三方内容**。把 marked 的输出直接 innerHTML 等于开 XSS 后门。
   * 这里不用正则（正则做 HTML 消毒必被绕过），而是**解析成 DOM 后按白名单重建**：
   * 只创建允许的标签、只复制允许的属性，其余一律丢弃。
   *
   * 故意不允许 img：AI 若输出 ![](http://x/y.png)，会在打开消息时自动发起请求，
   * 等于把"你是否看了这条消息"泄露给第三方。要图可以点链接跳浏览器看。
   */
  var ALLOWED = {
    P: [], BR: [], HR: [],
    H1: [], H2: [], H3: [], H4: [], H5: [], H6: [],
    UL: [], OL: [], LI: [],
    STRONG: [], B: [], EM: [], I: [], DEL: [], S: [], CODE: [],
    PRE: [], BLOCKQUOTE: [],
    TABLE: [], THEAD: [], TBODY: [], TR: [], TH: [], TD: [],
    A: ['href', 'title'],
  };

  function safeHref(href) {
    var h = String(href || '').trim();
    // 只允许 http/https：挡掉 javascript: data: vbscript: file: 等
    return /^https?:\/\//i.test(h) ? h : null;
  }

  function sanitize(node, out) {
    var kids = node.childNodes || [];
    for (var i = 0; i < kids.length; i++) {
      var n = kids[i];
      if (n.nodeType === 3) {                       // 文本
        out.appendChild(document.createTextNode(n.nodeValue));
        continue;
      }
      if (n.nodeType !== 1) continue;               // 注释等一律丢
      var tag = String(n.tagName || '').toUpperCase();
      var attrs = ALLOWED[tag];
      if (!attrs) continue;                         // 不在白名单：整棵子树丢弃
      var e = document.createElement(tag);
      for (var k = 0; k < attrs.length; k++) {
        var v = n.getAttribute && n.getAttribute(attrs[k]);
        if (v == null) continue;
        if (attrs[k] === 'href') {
          var ok = safeHref(v);
          if (ok) { e.setAttribute('href', ok); e.setAttribute('rel', 'noreferrer noopener'); }
        } else {
          e.setAttribute(attrs[k], v);
        }
      }
      sanitize(n, e);
      out.appendChild(e);
    }
  }

  function renderMarkdown(text) {
    var box = el('div', 'md');
    var src = String(text == null ? '' : text);
    if (!src) return box;
    var html = null;
    try {
      if (window.marked && typeof window.marked.parse === 'function') {
        html = window.marked.parse(src, { gfm: true, breaks: true });
        // marked 新版可能返回 Promise（异步扩展）；拿到 Promise 说明用法不对，
        // 当作解析失败处理，而不是把 "[object Promise]" 渲染出去
        if (html && typeof html.then === 'function') html = null;
        // 解析成功 → 清掉之前的失败标记，让横幅能自己收回去
        if (html != null && markdownBroken) { markdownBroken = false; markdownWarned = false; setError(''); }
      }
    } catch (e) { html = null; }
    if (html == null) {
      // 回退纯文本时**必须留痕**：否则「marked 没加载上」会表现成
      // 「Markdown 不生效但界面一切正常」，排查时毫无线索。
      markdownBroken = true;
      // 顺手尝试补载一次（页面初次加载时服务可能还没起来）
      ensureMarked();
      box.appendChild(document.createTextNode(src));
      return box;
    }
    var tpl = document.createElement('div');
    tpl.innerHTML = html;                           // 游离节点：不执行脚本、不加载资源
    sanitize(tpl, box);
    return box;
  }
  /** marked 是否加载失败（首次渲染时探测，用于在界面上给出可见提示） */
  var markdownBroken = false;
  var markdownWarned = false;
  var markedLoading = false;

  /**
   * 补载 marked。
   *
   * 为什么需要它：<script src="/vendor/marked.umd.js"> 是页面加载时一次性拉取的。
   * 如果那一刻服务还没起来（或网络抖动），window.marked 就永远缺席，除非用户重开窗口——
   * 而用户根本不知道该这么做。这里改成按需重试：拉到了就地生效，不用重开。
   */
  function ensureMarked() {
    if (markedLoading) return;
    if (window.marked && typeof window.marked.parse === 'function') return;
    markedLoading = true;
    try {
      var s = document.createElement('script');
      s.src = '/vendor/marked.umd.js?retry=' + Date.now();
      s.onload = function () {
        markedLoading = false;
        if (window.marked && typeof window.marked.parse === 'function') {
          markdownBroken = false;
          markdownWarned = false;
          setError('');
          // 重绘一遍，把已经渲染成纯文本的消息换成 Markdown
          state.seen = {};
          msgsEl.textContent = '';
          state.lastCount = 0;
          renderMsgs();
          renderStatus();
        }
      };
      s.onerror = function () { markedLoading = false; };
      document.head.appendChild(s);
    } catch (e) { markedLoading = false; }
  }

  // ===================== 渲染：参与者 =====================
  function renderPeers() {
    peersEl.textContent = '';
    peersEl.appendChild(el('span', 'lbl', '参与者'));
    if (!state.alive) { peersEl.appendChild(el('span', 'lbl', state.error || '未连接')); return; }
    var list = peers();
    if (!list.length) { peersEl.appendChild(el('span', 'lbl', '没有可用窗口')); return; }

    var busyList = state.chat.busy || [];
    var nowId = busyList.length === 1 ? busyList[0] : null;

    list.forEach(function (w) {
      var c = el('span', 'chip');
      c.style.setProperty('--id-h', hueOf(w.windowId));
      c.appendChild(el('span', 'av', initialOf(w.title || w.providerId)));
      c.appendChild(el('span', 'nm', w.title || w.url || ('窗口 ' + w.windowId)));
      c.appendChild(el('span', 'p', w.providerId || '?'));
      if (!w.canInject) c.className += ' dead';
      else if (state.selected[w.windowId]) c.className += ' on';
      if (w.windowId === nowId) c.className += ' now';
      if (w.canInject) {
        c.title = state.selected[w.windowId] ? '点击取消选中' : '点击选中';
        c.addEventListener('click', function () {
          state.selected[w.windowId] = !state.selected[w.windowId];
          renderPeers(); renderSendTo();
        });
      }
      peersEl.appendChild(c);
    });

    var allOn = list.length > 0 && list.every(function (w) { return !w.canInject || state.selected[w.windowId]; });
    var a = el('span', 'chip all' + (allOn ? ' on' : ''));
    a.appendChild(el('span', null, allOn ? '取消全体' : '全体'));
    a.addEventListener('click', function () {
      var on = !allOn;
      list.forEach(function (w) { if (w.canInject) state.selected[w.windowId] = on; });
      renderPeers(); renderSendTo();
    });
    peersEl.appendChild(a);
  }

  function renderSendTo() {
    sendToEl.textContent = '';
    var t = targetList();
    sendToEl.appendChild(el('span', null, '发送给'));
    if (!t.length) { sendToEl.appendChild(el('span', 'none', '没有可用的对话对象')); return; }
    t.forEach(function (w) {
      var g = el('span', 'tg', '@' + (w.title || w.providerId));
      g.title = '点击移除';
      g.addEventListener('click', function () {
        state.selected[w.windowId] = false;
        renderPeers(); renderSendTo();
      });
      sendToEl.appendChild(g);
    });
  }

  // ===================== 渲染：消息 =====================
  function sameGroup(prev, m) {
    if (!prev) return false;
    if (prev.role !== m.role) return false;
    if (m.role === 'system') return false;
    if (prev.who !== m.who) return false;
    return (m.at - prev.at) < 5 * 60 * 1000;
  }

  function renderMsgs() {
    var ms = state.chat.messages || [];
    var prevCount = state.lastCount || 0;
    // 记录被清空（或换了一轮）→ 整体重绘
    if (ms.length < prevCount) { msgsEl.textContent = ''; state.seen = {}; }
    state.lastCount = ms.length;

    var busy = (state.chat.busy || []).length;
    var streaming = Object.keys(state.streams).length > 0;
    var working = !!(state.chat.sending || busy || streaming);

    if (!ms.length && !working) {
      if (!msgsEl.querySelector('.empty')) {
        msgsEl.textContent = '';
        var e = el('div', 'empty');
        e.appendChild(el('span', null, '在下面输入消息，用 '));
        e.appendChild(el('b', null, '@'));
        e.appendChild(el('span', null, ' 选择要发给谁。'));
        e.appendChild(document.createElement('br'));
        e.appendChild(el('span', null, '可以拖入图片或文件，也可以直接粘贴截图。'));
        msgsEl.appendChild(e);
      }
      return;
    }
    var emp = msgsEl.querySelector('.empty');
    if (emp) emp.remove();

    var stick = msgsEl.scrollTop + msgsEl.clientHeight >= msgsEl.scrollHeight - 90;

    for (var i = 0; i < ms.length; i++) {
      var m = ms[i];
      if (state.seen[m.id]) continue;
      state.seen[m.id] = true;
      var prev = i > 0 ? ms[i - 1] : null;
      // 跨天插一个分隔
      if (prev && new Date(prev.at).toDateString() !== new Date(m.at).toDateString()) {
        msgsEl.appendChild(el('div', 'daysep', fmtDay(m.at)));
      }
      var node = buildMsg(m);
      if (sameGroup(prev, m)) node.className += ' tail';
      msgsEl.appendChild(node);
    }

    var old = msgsEl.querySelector('.running');
    if (old) old.remove();
    // 有流式气泡时不显示"等待"占位——那会让同一个人出现两个气泡
    if (working && !Object.keys(state.streams).length) {
      var r = el('div', 'ev sys running');
      var b = el('div', 'bub');
      var tp = el('span', 'typing');
      tp.appendChild(el('span', null, busy ? ('等待 ' + busy + ' 位回复') : '正在发送'));
      tp.appendChild(el('b')); tp.appendChild(el('b')); tp.appendChild(el('b'));
      b.appendChild(tp);
      r.appendChild(b);
      msgsEl.appendChild(r);
    }
    if (stick) msgsEl.scrollTop = msgsEl.scrollHeight;

    // 流式节点可能在整树重绘时被清掉，这里补回来
    if (Object.keys(state.streams).length) renderStreams();

    // marked 没加载上 → 在界面上说清楚，而不是让用户对着字面星号猜
    if (markdownBroken && !markdownWarned) {
      markdownWarned = true;
      setError('Markdown 渲染库未加载，消息暂以纯文本显示。正在自动重试…');
      renderStatus();
    }
  }

  function buildMsg(m) {
    if (m.role === 'system') {
      var s = el('div', 'ev sys' + (m.err ? ' err' : ''));
      s.appendChild(el('div', 'bub', m.text));
      return s;
    }
    var me = m.role === 'user';
    var d = el('div', 'ev ' + (me ? 'me' : 'ai'));
    d.style.setProperty('--id-h', me ? 212 : hueOf(m.windowId));

    d.appendChild(el('div', 'av', me ? '我' : initialOf(m.who)));

    var col = el('div', 'col');
    var hd = el('div', 'hd');
    hd.appendChild(el('span', 'who', m.who || (me ? '我' : 'AI')));
    hd.appendChild(el('span', 'tm', fmtTime(m.at)));
    col.appendChild(hd);

    var bub = el('div', 'bub');
    if (me) bub.appendChild(el('span', null, m.text || ''));
    else bub.appendChild(renderMarkdown(m.text));
    bub.style.whiteSpace = me ? 'pre-wrap' : 'normal';

    if (m.attach && m.attach.length) {
      var box = el('div', 'att');
      m.attach.forEach(function (a) {
        if (a.dataUrl && isImg(a.mime, a.name)) {
          var im = el('img');
          im.src = a.dataUrl;
          im.title = a.name + '（点击放大）';
          im.addEventListener('click', function () { openLightbox(a.dataUrl); });
          box.appendChild(im);
        } else {
          box.appendChild(el('span', 'f', '📄 ' + a.name));
        }
      });
      bub.appendChild(box);
    }
    col.appendChild(bub);

    if (me && m.targets && m.targets.length) {
      var to = el('div', 'to');
      to.appendChild(el('span', 'ic', '→'));
      to.appendChild(el('span', null, m.targets.map(function (t) { return t.label; }).join('、')
        + (m.mode === 'sequential' ? '（顺序）' : '')));
      col.appendChild(to);
    }
    d.appendChild(col);
    return d;
  }

  function openLightbox(src) {
    lightboxImg.src = src;
    lightbox.className = 'show';
  }
  lightbox.addEventListener('click', function () { lightbox.className = ''; lightboxImg.src = ''; });

  // ===================== 渲染：附件 =====================
  function renderAtts() {
    attsEl.textContent = '';
    state.attachments.forEach(function (a, i) {
      var d = el('div', 'at' + (a.status === 'sending' ? ' st' : ''));
      if (a.dataUrl && isImg(a.mime, a.name)) {
        var im = el('img');
        im.src = a.dataUrl;
        d.appendChild(im);
      } else {
        d.appendChild(el('span', null, '📄'));
      }
      var nm = el('span', 'nm', a.name);
      nm.title = a.name;
      d.appendChild(nm);
      d.appendChild(el('span', 'sz', fmtSize(a.size)));
      if (a.status !== 'sending') {
        var x = el('span', 'x', '✕');
        x.title = '移除';
        x.addEventListener('click', function () { state.attachments.splice(i, 1); renderAtts(); });
        d.appendChild(x);
      }
      attsEl.appendChild(d);
    });
  }

  function addFiles(files) {
    var arr = Array.prototype.slice.call(files || []);
    for (var i = 0; i < arr.length; i++) {
      (function (f) {
        if (f.size > MAX_ATTACH_MB * 1024 * 1024) {
          setError('「' + f.name + '」超过 ' + MAX_ATTACH_MB + 'MB 上限');
          renderStatus(); return;
        }
        var fr = new FileReader();
        fr.onload = function () {
          var s = String(fr.result);
          var k = s.indexOf(',');
          state.attachments.push({
            name: f.name || ('粘贴的图片.' + (f.type.split('/')[1] || 'png')),
            mime: f.type || 'application/octet-stream',
            size: f.size,
            data: k >= 0 ? s.slice(k + 1) : s,
            dataUrl: s,
            status: 'ready'
          });
          renderAtts();
        };
        fr.onerror = function () { setError('读取「' + f.name + '」失败'); renderStatus(); };
        fr.readAsDataURL(f);
      })(arr[i]);
    }
  }

  // ===================== @ 提及 =====================
  function openMention(query) {
    var list = [{ id: 'all', label: '全体', plat: '发给所有已勾选的人', hue: 212 }];
    var pool = targetList();
    if (!pool.length) pool = peers().filter(function (w) { return w.canInject; });
    pool.forEach(function (w) {
      list.push({
        id: String(w.windowId),
        label: w.title || w.providerId || ('窗口 ' + w.windowId),
        plat: w.providerId || '',
        hue: hueOf(w.windowId),
      });
    });
    if (query) {
      var q = query.toLowerCase();
      list = list.filter(function (x) {
        if (x.id === 'all') return '全体 all'.indexOf(q) >= 0 || query === '全' || query === '全体';
        return String(x.label).toLowerCase().indexOf(q) >= 0 || String(x.plat).toLowerCase().indexOf(q) >= 0;
      });
    }
    state.mention.items = list;
    state.mention.query = query || '';
    state.mention.idx = 0;
    state.mention.open = list.length > 0;
    renderMention();
  }

  function closeMention() {
    state.mention.open = false;
    mentionEl.className = '';
    mentionEl.textContent = '';
  }

  function renderMention() {
    if (!state.mention.open) { closeMention(); return; }
    mentionEl.textContent = '';
    mentionEl.appendChild(el('div', 'hd', state.mention.query
      ? ('匹配「' + state.mention.query + '」')
      : '↑↓ 选择 · Enter 确认 · Esc 取消'));
    state.mention.items.forEach(function (it, i) {
      var d = el('div', 'it' + (i === state.mention.idx ? ' sel' : ''));
      d.style.setProperty('--id-h', it.hue);
      d.appendChild(el('span', 'av', initialOf(it.label)));
      d.appendChild(el('span', null, it.label));
      d.appendChild(el('span', 'p', it.plat));
      d.addEventListener('mousedown', function (e) { e.preventDefault(); chooseMention(i); });
      mentionEl.appendChild(d);
    });
    mentionEl.className = 'show';
  }

  function detectMention() {
    var v = inputEl.value;
    var pos = inputEl.selectionStart;
    var before = v.slice(0, pos);
    var at = before.lastIndexOf('@');
    if (at < 0) { closeMention(); return; }
    var frag = before.slice(at + 1);
    if (/[\s\n]/.test(frag)) { closeMention(); return; }
    state.mention.at = at;
    openMention(frag);
  }

  function chooseMention(i) {
    var it = state.mention.items[i];
    if (!it) return;
    var v = inputEl.value;
    var at = state.mention.at;
    var pos = inputEl.selectionStart;
    var insert = '@' + it.label + ' ';
    inputEl.value = v.slice(0, at) + insert + v.slice(pos);
    var np = at + insert.length;
    try { inputEl.setSelectionRange(np, np); } catch (e) {}

    if (it.id === 'all') {
      peers().forEach(function (w) { if (w.canInject) state.selected[w.windowId] = true; });
    } else {
      peers().forEach(function (w) { state.selected[w.windowId] = false; });
      state.selected[Number(it.id)] = true;
    }
    closeMention();
    renderPeers(); renderSendTo();
  }

  // ===================== 流式输出（SSE） =====================
  /**
   * 用 EventSource 接服务端推送的增量文本。
   *
   * 为什么不用 fetch 流式读：EventSource 自带重连与事件分发，代码量小得多；
   * 代价是不能带自定义请求头，所以令牌走 query（页面从服务端拿到，不经第三方）。
   *
   * 连不上怎么办：不报错、不打断使用 —— 退回原来的 1.5 秒轮询（回复照样会到，
   * 只是没有打字机效果），并在顶栏用小圆点如实标出状态。
   */
  var es = null;
  var esRetry = null;

  function setSse(status, text) {
    state.sse = status;
    sseEl.className = status;
    sseTxt.textContent = text || (status === 'on' ? '实时' : status === 'off' ? '轮询' : '连接中');
    sseEl.title = status === 'on'
      ? '正在接收实时增量（打字机效果）'
      : '未连接实时通道，已退回轮询模式（回复仍会正常送达）';
  }

  function connectSse() {
    if (es) { try { es.close(); } catch (e) {} es = null; }
    if (typeof EventSource !== 'function') { setSse('off', '轮询'); return; }
    try {
      es = new EventSource('http://127.0.0.1:' + PORT + '/chat/events?t=' + encodeURIComponent(TOKEN));
    } catch (e) { setSse('off', '轮询'); return; }

    es.addEventListener('open', function () { setSse('on'); });

    es.addEventListener('hello', function () {
      setSse('on');
      // 服务端可能已经在推流（比如页面刚刷新），拉一次快照补上
      api('/chat/status').then(function (r) {
        if (r && r.streams) { state.streams = r.streams; renderMsgs(); }
      }, function () {});
    });

    es.addEventListener('stream-start', function (e) {
      var d = parseEv(e);
      if (!d) return;
      state.streams[d.windowId] = { text: '', label: d.label || '' };
      renderMsgs();
    });

    es.addEventListener('stream-delta', function (e) {
      var d = parseEv(e);
      if (!d) return;
      var s = state.streams[d.windowId];
      if (!s) { state.streams[d.windowId] = { text: d.text || '', label: '' }; }
      else { s.text = d.text || ''; }
      renderStreams();
    });

    es.addEventListener('stream-end', function (e) {
      var d = parseEv(e);
      if (!d) return;
      delete state.streams[d.windowId];
      // 关键：删除后必须重新跑一次 renderStreams 才会把气泡摘掉。
      // 只调 renderMsgs() 不行 —— 它只在"还有流"时才回头调 renderStreams。
      renderStreams();
      // 最终内容以 /chat/status 里落库的消息为准
      pullChat().then(function () { renderMsgs(); }, function () { renderMsgs(); });
    });

    es.addEventListener('error', function () {
      // EventSource 会自己重连；这里只更新指示，不弹错误横幅（不该打断使用）
      setSse('off', '轮询');
    });
  }

  function parseEv(e) {
    try { return JSON.parse(e.data); } catch (_) { return null; }
  }

  /** 只更新正在流式的气泡内容，不重建整棵 DOM（否则光标闪烁、滚动会跳） */
  function renderStreams() {
    var stick = msgsEl.scrollTop + msgsEl.clientHeight >= msgsEl.scrollHeight - 90;
    var ids = Object.keys(state.streams);

    // 先摘掉已经没有对应流的节点。
    // 直接遍历 children 而不用 querySelectorAll：少一层选择器依赖，行为更可预期。
    var kids = Array.prototype.slice.call(msgsEl.children || []);
    for (var i = 0; i < kids.length; i++) {
      var n = kids[i];
      if (!n.getAttribute || n.className.indexOf('streaming') < 0) continue;
      if (ids.indexOf(String(n.getAttribute('data-wid'))) < 0) n.remove();
    }

    for (var k = 0; k < ids.length; k++) {
      var wid = ids[k];
      var st = state.streams[wid];
      var node = findByWid(wid);
      if (!node) {
        node = buildStreamingNode(wid, st);
        msgsEl.appendChild(node);
        // 流式气泡出现时，把"等待"占位收起来，避免同一个人出现两个气泡
        var r = msgsEl.querySelector('.running');
        if (r) r.remove();
      }
      var body = queryIn(node, 'stream-body');
      if (body) {
        body.textContent = st.text || '';
        var dots = queryIn(node, 'stream-dots');
        if (dots) dots.style.display = st.text ? 'none' : '';
      }
    }
    if (stick) msgsEl.scrollTop = msgsEl.scrollHeight;
  }

  /** 在子树里找第一个带指定 class 的元素（不依赖 querySelector 的选择器实现） */
  function queryIn(root, cls) {
    var kids = Array.prototype.slice.call(root.children || []);
    for (var i = 0; i < kids.length; i++) {
      if (kids[i].className && kids[i].className.split(/\s+/).indexOf(cls) >= 0) return kids[i];
      var deep = queryIn(kids[i], cls);
      if (deep) return deep;
    }
    return null;
  }

  function findByWid(wid) {
    var all = msgsEl.children || [];
    for (var i = 0; i < all.length; i++) {
      if (all[i].getAttribute && all[i].getAttribute('data-wid') === String(wid)) return all[i];
    }
    return null;
  }

  function buildStreamingNode(wid, st) {
    var d = el('div', 'ev ai streaming');
    d.setAttribute('data-wid', String(wid));
    d.style.setProperty('--id-h', hueOf(wid));
    d.appendChild(el('div', 'av', initialOf(st.label)));
    var col = el('div', 'col');
    var hd = el('div', 'hd');
    hd.appendChild(el('span', 'who', st.label || ('窗口 ' + wid)));
    hd.appendChild(el('span', 'tm', '生成中'));
    col.appendChild(hd);
    var bub = el('div', 'bub');
    var body = el('span', 'stream-body', st.text || '');
    var dots = el('span', 'stream-dots');
    dots.appendChild(el('i')); dots.appendChild(el('i')); dots.appendChild(el('i'));
    bub.appendChild(body);
    bub.appendChild(dots);
    bub.appendChild(el('span', 'cursor'));
    col.appendChild(bub);
    d.appendChild(col);
    return d;
  }

  // ===================== 状态 =====================
  function renderStatus() {
    var busy = (state.chat.busy || []).length;
    var working = !!(state.chat.sending || busy);
    dot.className = state.alive ? (working ? 'run' : 'on') : 'err';
    if (!state.alive) {
      statusEl.className = 'bad';
      statusEl.textContent = state.error || '未连接主进程服务';
    } else if (state.error) {
      statusEl.className = 'bad';
      statusEl.textContent = state.error;
    } else if (busy) {
      statusEl.className = '';
      statusEl.textContent = '等待 ' + busy + ' 位回复…';
    } else if (state.chat.sending) {
      statusEl.className = '';
      statusEl.textContent = '正在发送…';
    } else {
      statusEl.className = '';
      statusEl.textContent = '就绪';
    }
    btnSend.disabled = !state.alive;
    var t = targetList();
    var n = (state.chat.messages || []).length;
    footEl.textContent = '已选 ' + t.length + ' 位 · ' + n + ' 条记录 · 端口 ' + PORT;
  }

  function applyTheme(scheme) {
    if (scheme !== 'light' && scheme !== 'dark') return;
    if (state.theme === scheme) return;
    state.theme = scheme;
    document.documentElement.className = (scheme === 'light' ? 'light' : '');
  }

  function renderAll() { renderPeers(); renderSendTo(); renderMsgs(); renderAtts(); renderStatus(); }

  // ===================== 拉取 =====================
  function pullStatus() {
    return api('/status').then(function (r) {
      state.alive = true;
      state.windows = r.windows || [];
      if (r.port) PORT = r.port;
      if (r.theme) applyTheme(r.theme);
      if (!Object.keys(state.selected).length) {
        peers().forEach(function (w) { if (w.canInject) state.selected[w.windowId] = true; });
      }
    }, function (e) {
      state.alive = false;
      state.error = '连不上主进程服务（端口 ' + PORT + '）：' + ((e && e.message) || e)
        + ' —— 若刚装好插件，请重启 Cuckoo';
      state.windows = [];
    });
  }
  function pullChat() {
    return api('/chat/status').then(function (r) {
      state.chat = r.chat || state.chat;
      state.alive = true;
    }, function () {});
  }
  function refresh() {
    return pullStatus().then(pullChat).then(renderAll, renderAll);
  }

  // ===================== 发送 =====================
  function send() {
    var text = inputEl.value.trim();
    if (!text && !state.attachments.length) return;
    if (!text && state.attachments.length) text = '（请查看附件）';
    var t = targetList();
    if (!t.length) { setError('没有可用的对话对象：请打开至少一个 AI 平台窗口'); renderStatus(); return; }

    var payload = {
      text: text,
      targets: t.map(function (w) { return w.windowId; }),
      mode: 'parallel',
      files: state.attachments.map(function (a) {
        return { name: a.name, mime: a.mime, data: a.data };
      })
    };

    setError('');
    btnSend.disabled = true;
    btnSend.className = 'sendbtn busy';

    api('/chat/send', { method: 'POST', body: payload }).then(function (r) {
      if (!r || !r.ok) { setError((r && r.error) || '发送失败'); return; }
      if (r.failed && r.failed.length) {
        setError('有 ' + r.failed.length + ' 个附件未上传成功，文字已发出。'
          + r.failed.map(function (f) {
              return '「' + f.name + '」' + (f.target ? ('→' + f.target) : '') + '：' + f.error;
            }).join('；'));
      }
      inputEl.value = '';
      inputEl.style.height = 'auto';
      state.attachments = [];
      renderAtts();
      return refresh();
    }, function (e) {
      setError('发送失败：' + ((e && e.message) || e) + '（若服务未启动，请重启 Cuckoo 让插件重新加载）');
    }).then(function () {
      btnSend.disabled = false;
      btnSend.className = 'sendbtn';
      renderStatus();
    });
  }

  // ===================== 事件 =====================
  btnSend.addEventListener('click', send);

  inputEl.addEventListener('input', function () {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(200, inputEl.scrollHeight) + 'px';
    detectMention();
  });

  inputEl.addEventListener('keydown', function (e) {
    if (state.mention.open) {
      if (e.key === 'ArrowDown') { e.preventDefault(); state.mention.idx = (state.mention.idx + 1) % state.mention.items.length; renderMention(); return; }
      if (e.key === 'ArrowUp') { e.preventDefault(); state.mention.idx = (state.mention.idx - 1 + state.mention.items.length) % state.mention.items.length; renderMention(); return; }
      if (e.key === 'Enter' || e.key === 'Tab') { e.preventDefault(); chooseMention(state.mention.idx); return; }
      if (e.key === 'Escape') { e.preventDefault(); closeMention(); return; }
    }
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      send();
    }
  });

  inputEl.addEventListener('paste', function (e) {
    var items = (e.clipboardData && e.clipboardData.items) || [];
    var files = [];
    for (var i = 0; i < items.length; i++) {
      if (items[i].kind === 'file') {
        var f = items[i].getAsFile();
        if (f) files.push(f);
      }
    }
    if (files.length) { e.preventDefault(); addFiles(files); }
  });

  btnAttach.addEventListener('click', function () { filePick.click(); });
  filePick.addEventListener('change', function () { addFiles(filePick.files); filePick.value = ''; });

  var dragDepth = 0;
  window.addEventListener('dragenter', function (e) {
    if (!e.dataTransfer || Array.prototype.indexOf.call(e.dataTransfer.types || [], 'Files') < 0) return;
    e.preventDefault(); dragDepth++; dropEl.className = 'show';
  });
  window.addEventListener('dragover', function (e) {
    if (e.dataTransfer && Array.prototype.indexOf.call(e.dataTransfer.types || [], 'Files') >= 0) e.preventDefault();
  });
  window.addEventListener('dragleave', function () {
    dragDepth = Math.max(0, dragDepth - 1);
    if (!dragDepth) dropEl.className = '';
  });
  window.addEventListener('drop', function (e) {
    e.preventDefault(); dragDepth = 0; dropEl.className = '';
    if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) addFiles(e.dataTransfer.files);
  });

  btnRefresh.addEventListener('click', function () { refresh(); });
  btnClear.addEventListener('click', function () {
    if (!confirm('清空聊天记录？')) return;
    api('/chat/clear', { method: 'POST' }).then(refresh, refresh);
  });

  // ===================== 轮询 =====================
  applyTheme('dark');
  // 页面加载时若 marked 缺席（静态 <script> 拉取失败/服务未就绪），立刻补一次
  ensureMarked();
  refresh().then(function () {
    // 首次拿到端口后立刻接 SSE（端口可能被换过，所以放在 refresh 之后）
    connectSse();
  });

  /**
   * 轮询节奏：固定 1.5 秒。
   *
   * 曾经想过"SSE 连上就放慢"，但那会引入一类难查的延迟——比如切主题要等 5 秒才变。
   * 本地 loopback 上一次 /status 的代价可以忽略，可预期比省这点开销重要得多。
   * SSE 的职责是让流式输出顺滑，不是替代轮询。
   */
  function tick() {
    pullStatus().then(pullChat).then(function () {
      renderPeers(); renderSendTo(); renderMsgs(); renderStatus();
    }, function () {}).then(function () {
      setTimeout(tick, 1500);
    });
  }
  setTimeout(tick, 1500);
})();
</script>
</body>
</html>
