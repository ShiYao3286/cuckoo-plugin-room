<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>多 AI 同室</title>
<style>
  /* ==========================================================================
     配色：跟随 Cuckoo 应用主题（主进程经 /status 的 theme 字段下发，页面每 1.5s 轮询）
     层次用「表面」区分，而不是靠 1px 边框硬切：
       chrome（顶栏/参与者栏/底栏）最沉 → canvas（消息区）最舒适 → card（气泡/输入）抬起
     ========================================================================== */
  :root{
    --chrome:#0f1115;
    --canvas:#15181e;
    --card:#1e2229;
    --card-2:#252a33;
    --hover:#2b313b;
    --line:rgba(255,255,255,.07);
    --line-2:rgba(255,255,255,.13);
    --fg:#e6e9ef;
    --fg-2:#a3aab8;
    --fg-3:#6f7684;
    --pri:#6b83ff;
    --pri-fg:#fff;
    --pri-soft:rgba(107,131,255,.16);
    --self-bg:rgba(107,131,255,.14);
    --self-line:rgba(107,131,255,.34);
    --ok:#3fbf7f;
    --warn:#e0a92e;
    --err:#f0605f;
    --err-bg:rgba(240,96,95,.13);
    --err-line:rgba(240,96,95,.4);
    --code-bg:rgba(0,0,0,.32);
    --id-sat:58%;
    --id-light:54%;
    --shadow:0 1px 2px rgba(0,0,0,.24);
    --shadow-lg:0 8px 28px rgba(0,0,0,.45);
    --radius:10px;

    /* ===== 设计令牌 =====
       为什么要令牌：改造前有 12 种字号、57 种 padding、9 种圆角，
       全是随手填的像素值，累积下来没有任何节奏。这里收敛成少数几档。 */

    /* 间距：4 的倍数，只用这 5 档 */
    --s1:4px;
    --s2:8px;
    --s3:12px;
    --s4:16px;
    --s5:24px;

    /* 字号：相邻档至少差 1.5px，肉眼可辨。
       改造前 10.5/11/11.5/12/12.5 五档挤在 2px 内，等于没有层级。 */
    --fs-xs:11px;      /* 时间戳、极次要信息 */
    --fs-sm:12px;      /* 标签、按钮、辅助说明 */
    --fs-base:13.5px;  /* 正文 */
    --fs-md:15px;      /* 小标题 */
    --fs-lg:17px;      /* 区块标题 */

    /* 行高：中文需要比英文更多呼吸空间。改造前 1.62 偏紧。 */
    --lh-tight:1.35;
    --lh-base:1.75;

    /* 圆角：3 档 */
    --r-sm:6px;
    --r-md:10px;
    --r-lg:14px;

    /* 气泡最大行宽：680px ≈ 中文 42 字/行，落在舒适区。
       改造前 760px 一行能放 50+ 汉字，读起来累。 */
    --bubble-max:680px;
  }
  :root.light{
    --chrome:#eceef2;
    --canvas:#f7f8fa;
    --card:#ffffff;
    --card-2:#f1f3f7;
    --hover:#e6e9ef;
    --line:rgba(16,24,40,.08);
    --line-2:rgba(16,24,40,.15);
    --fg:#16181d;
    --fg-2:#545a67;
    --fg-3:#8a8f9b;
    --pri:#4d6bfe;
    --pri-soft:rgba(77,107,254,.1);
    --self-bg:rgba(77,107,254,.09);
    --self-line:rgba(77,107,254,.3);
    --ok:#30a46c;
    --warn:#b8860b;
    --err:#e5484d;
    --err-bg:rgba(229,72,77,.08);
    --err-line:rgba(229,72,77,.3);
    --code-bg:rgba(16,24,40,.055);
    --id-sat:52%;
    --id-light:46%;
    --shadow:0 1px 2px rgba(16,24,40,.05);
    --shadow-lg:0 8px 28px rgba(16,24,40,.12);
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--canvas);color:var(--fg);
    font:var(--fs-base)/var(--lh-base) system-ui,"Segoe UI","Microsoft YaHei",sans-serif;
    display:flex;flex-direction:column;overflow:hidden;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:var(--r-sm);border:2px solid transparent;background-clip:content-box}
  ::-webkit-scrollbar-thumb:hover{background:var(--fg-3);background-clip:content-box}
  ::-webkit-scrollbar-track{background:transparent}

  button{font:inherit;cursor:pointer;border:1px solid var(--line-2);background:var(--card);
    color:var(--fg);border-radius:var(--r-sm);padding:6px 12px;white-space:nowrap;flex:none;transition:.13s}
  button:hover:not(:disabled){background:var(--hover)}
  button:disabled{opacity:.38;cursor:not-allowed}
  button.pri{background:var(--pri);border-color:var(--pri);color:var(--pri-fg);font-weight:500}
  button.pri:hover:not(:disabled){filter:brightness(1.1)}
  button.icon{padding:5px 8px;font-size:var(--fs-md);line-height:1.2;background:transparent;border-color:transparent;color:var(--fg-2)}
  button.icon:hover:not(:disabled){background:var(--hover);color:var(--fg)}

  /* ---------- 顶栏（chrome） ---------- */
  /* 分左右两组，中间弹性隔开。
     改造前 11 个元素平铺，gap 统一 9px，视觉上没有归属关系。 */
  header{display:flex;align-items:center;gap:var(--s3);padding:var(--s2) var(--s3);
    background:var(--chrome);border-bottom:1px solid var(--line);flex:none;min-height:44px}
  header .hg{display:flex;align-items:center;gap:var(--s2);min-width:0}
  header .hg-left{flex:none}
  header .hg-right{flex:1;justify-content:flex-end;min-width:0}
  header h1{font-size:var(--fs-base);font-weight:600;flex:none;letter-spacing:.2px}
  #dot{width:7px;height:7px;border-radius:50%;background:var(--fg-3);flex:none;transition:.2s}
  #dot.on{background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 22%,transparent)}
  #dot.run{background:var(--warn);animation:pulse 1.1s ease-in-out infinite}
  #dot.err{background:var(--err)}
  @keyframes pulse{50%{opacity:.28}}
  #status{color:var(--fg-2);font-size:var(--fs-sm);white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;max-width:220px;flex:none}
  #status.bad{color:var(--err)}

  /* 「⋯」更多菜单：收纳低频操作（占用数、刷新、清空） */
  #moreWrap{position:relative;flex:none}
  #moreMenu{position:fixed;min-width:190px;background:var(--card);border:1px solid var(--line-2);
    border-radius:var(--r-md);box-shadow:var(--shadow-lg);display:none;z-index:9999;padding:var(--s1)}
  #moreMenu.show{display:block}
  #moreMenu .mi{display:flex;align-items:center;gap:var(--s2);padding:6px var(--s2);
    border-radius:var(--r-sm);cursor:pointer;font-size:var(--fs-sm);color:var(--fg-2)}
  #moreMenu .mi:hover{background:var(--hover);color:var(--fg)}
  #moreMenu .mi span{flex:1;white-space:nowrap}
  #moreMenu .mi b{font-weight:600;color:var(--pri);font-size:var(--fs-xs)}
  #moreMenu .mi.danger:hover{color:var(--err)}
  /* 有文件被占用时，「⋯」上加个小圆点——否则收起来就看不见了 */
  button.icon.hasdot{position:relative}
  button.icon.hasdot::after{content:'';position:absolute;top:3px;right:3px;width:5px;height:5px;
    border-radius:50%;background:var(--warn)}

  /* ---------- 话题切换 ---------- */
  #topicWrap{position:relative;flex:none}
  #topicBtn{display:flex;align-items:center;gap:6px;padding:4px 10px;border-radius:var(--r-sm);
    background:var(--card);border:1px solid var(--line-2);color:var(--fg);font-size:var(--fs-sm);cursor:pointer;
    max-width:200px;transition:.12s}
  #topicBtn:hover{background:var(--hover)}
  #topicBtn .tn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #topicBtn .tc{color:var(--fg-3);font-size:var(--fs-xs);flex:none}

  /* 菜单用 position:fixed + JS 定位。
     为什么不用 absolute：它挂在 header 里，会被祖先的层叠上下文与后续元素遮挡，
     实测出现过只露出一条、点不到的情况。fixed 直接相对视口，不受祖先影响。 */
  #topicMenu{position:fixed;min-width:240px;max-width:320px;max-height:360px;overflow:auto;
    background:var(--card);border:1px solid var(--line-2);border-radius:var(--radius);
    box-shadow:var(--shadow-lg);display:none;z-index:9999;padding:5px}
  #topicMenu.show{display:block}
  #topicMenu .ti{display:flex;align-items:center;gap:7px;padding:6px 9px;border-radius:var(--r-sm);
    cursor:pointer;font-size:var(--fs-sm)}
  #topicMenu .ti:hover{background:var(--hover)}
  #topicMenu .ti.act{background:var(--pri-soft);color:var(--pri)}
  #topicMenu .ti .tn{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #topicMenu .ti .cnt{color:var(--fg-3);font-size:var(--fs-xs);flex:none}
  #topicMenu .ti .mini{color:var(--fg-3);font-size:var(--fs-sm);flex:none;padding:0 3px;border-radius:var(--r-sm);opacity:0}
  #topicMenu .ti:hover .mini{opacity:1}
  #topicMenu .ti .mini:hover{color:var(--pri);background:var(--card-2)}
  #topicMenu .ti .del:hover{color:var(--err)}
  #topicMenu .sep{height:1px;background:var(--line);margin:4px 2px}
  #topicMenu .new{padding:6px 9px;border-radius:var(--r-sm);cursor:pointer;font-size:var(--fs-sm);color:var(--pri)}
  #topicMenu .new:hover{background:var(--pri-soft)}

  /* 通用确认框（替代 confirm：Electron 里虽然可用，但样式是系统的，
     与整体界面不搭；这个还能显示多行与危险色） */
  #cfmMask{position:fixed;inset:0;background:rgba(0,0,0,.42);display:none;
    align-items:center;justify-content:center;z-index:10000;padding:24px}
  #cfmMask.show{display:flex}
  #cfmBox{background:var(--card);border:1px solid var(--line-2);border-radius:var(--radius);
    box-shadow:var(--shadow-lg);max-width:400px;width:100%;padding:16px 18px}
  #cfmBox .ct{font-size:var(--fs-base);font-weight:600;margin-bottom:8px}
  #cfmBox .cm{font-size:var(--fs-sm);color:var(--fg-2);line-height:1.65;white-space:pre-wrap;margin-bottom:14px}
  #cfmBox .cb{display:flex;gap:8px;justify-content:flex-end}
  #cfmBox .cb button{padding:6px 16px;font-size:var(--fs-sm)}
  #cfmBox .cb .ok{background:var(--err);border-color:var(--err);color:#fff}
  #cfmBox .cb .ok:hover{filter:brightness(1.08)}

  /* 内联输入：Electron 不支持 window.prompt()，
     所以新建/重命名话题都用这条内联输入行，不弹系统框。 */
  #topicMenu .inline{display:flex;gap:5px;padding:4px 3px}
  #topicMenu .inline input{flex:1;min-width:0;background:var(--card-2);color:var(--fg);
    border:1px solid var(--pri);border-radius:var(--r-sm);padding:4px 8px;font:inherit;font-size:var(--fs-sm);outline:none}
  #topicMenu .inline button{padding:4px 10px;font-size:var(--fs-sm);border-radius:var(--r-sm)}
  #topicMenu .hint{padding:6px 9px;color:var(--fg-3);font-size:var(--fs-xs);line-height:1.5}

  /* 分工讨论 */
  #planBar{display:none;flex-direction:column;gap:8px;margin-bottom:7px;padding:10px 12px;
    background:var(--card);border:1px solid var(--line-2);border-left:3px solid var(--pri);border-radius:var(--r-sm)}
  #planBar.show{display:flex}
  #planBar .ph{display:flex;align-items:center;gap:7px;font-size:var(--fs-sm);font-weight:600;color:var(--pri)}
  #planBar .pt{font-size:var(--fs-sm);color:var(--fg-2);line-height:1.55}
  #planBar textarea{width:100%;min-height:56px;max-height:160px;resize:vertical;
    background:var(--card-2);color:var(--fg);border:1px solid var(--line-2);border-radius:var(--r-sm);
    padding:7px 9px;font:inherit;font-size:var(--fs-sm);outline:none}
  #planBar textarea:focus{border-color:var(--pri)}
  #planBar .pb{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
  #planBar .pb .cost{font-size:var(--fs-xs);color:var(--warn);flex:1}
  /* 进度 */
  #planProg{display:none;align-items:center;gap:8px;padding:6px 12px;margin-bottom:7px;
    background:var(--pri-soft);border-radius:var(--r-sm);font-size:var(--fs-sm);color:var(--pri)}
  #planProg.show{display:flex}
  #planProg .bar{flex:1;height:4px;border-radius:var(--r-sm);background:var(--line-2);overflow:hidden}
  #planProg .bar i{display:block;height:100%;background:var(--pri);transition:width .3s}
  #planProg .stg{font-weight:600;flex:none}
  #planProg .stop{cursor:pointer;padding:2px 9px;border-radius:999px;
    border:1px solid var(--pri);color:var(--pri);font-size:var(--fs-xs);flex:none;background:transparent}
  #planProg .stop:hover{background:var(--pri);color:#fff}
  #relayWrap{display:flex;align-items:center;gap:5px;flex:none;font-size:var(--fs-sm);color:var(--fg-2);
    cursor:pointer;user-select:none}
  #relaySw{position:relative;width:30px;height:17px;border-radius:999px;background:var(--line-2);
    transition:.16s;flex:none}
  #relaySw.on{background:var(--pri)}
  #relaySw::after{content:'';position:absolute;left:2px;top:2px;width:13px;height:13px;border-radius:50%;
    background:#fff;transition:.16s}
  #relaySw.on::after{left:15px}

  /* 消息上的成员 @ 名 */
  .ev .hd .mn{color:var(--fg-3);font-size:var(--fs-xs);font-family:ui-monospace,Consolas,monospace;
    opacity:.75;margin-left:3px}
  .ev .bub .relay-tag{display:inline-block;margin-bottom:6px;padding:1px 7px;border-radius:999px;
    font-size:var(--fs-xs);background:var(--pri-soft);color:var(--pri)}

  /* 分工表标记栏 */
  .ev .bub .planhint{display:flex;align-items:center;gap:8px;margin-bottom:8px;
    padding-bottom:7px;border-bottom:1px solid var(--line-2);font-size:var(--fs-sm);color:var(--pri);font-weight:600}
  .ev .bub .planhint button{padding:2px 9px;font-size:var(--fs-xs);border-radius:var(--r-sm);
    background:var(--pri-soft);border-color:var(--pri);color:var(--pri);font-weight:400}

  /* 动作卡片：成员打算做什么（工具调用轮）
     原来是灰底 + 虚线边框，视觉上像故障提示；但动作是**正常信息**。
     改成浅蓝底 + 左侧色条：和正文区分得开，又不刺眼。 */
  .ev.act{opacity:1}
  .ev.act .bub{background:var(--pri-soft);border:none;border-left:3px solid var(--pri);
    border-radius:0 var(--r-sm) var(--r-sm) 0;box-shadow:none;
    font-family:ui-monospace,Consolas,monospace;font-size:var(--fs-sm);line-height:1.6;
    white-space:pre-wrap;word-break:break-word;color:var(--fg-2);max-height:180px;overflow:auto}
  .ev.act .hd .who{color:var(--fg-3)}
  .ev.act .hd::after{content:'🔧 动作';font-size:var(--fs-xs);color:var(--pri);
    background:var(--pri-soft);border-radius:999px;padding:0 7px;margin-left:auto;opacity:.9}
  .ev.act .hd .actmore{padding:1px 8px;font-size:var(--fs-xs);border-radius:var(--r-sm);
    background:transparent;border-color:var(--line-2);color:var(--fg-3)}
  .ev.act .hd .actmore:hover{color:var(--fg)}
  /* 动作声明的文件占用 */
  .ev.act .claims{display:flex;flex-wrap:wrap;gap:var(--s1);margin-top:var(--s1)}
  .ev.act .claims .cf{font-size:var(--fs-xs);padding:1px 6px;border-radius:var(--r-sm);
    background:var(--pri-soft);color:var(--pri);font-family:ui-monospace,Consolas,monospace}

  /* 思考过程（默认折叠，只给人看，不进上下文） */
  .ev .bub .thinkbox{margin-bottom:8px;border:1px solid var(--line-2);border-radius:var(--r-sm);
    background:var(--code-bg);overflow:hidden}
  .ev .bub .thinkbox .th{display:flex;align-items:center;gap:6px;padding:5px 10px;
    cursor:pointer;font-size:var(--fs-sm);color:var(--fg-3);user-select:none}
  .ev .bub .thinkbox .th:hover{color:var(--fg-2)}
  .ev .bub .thinkbox .th .ic{font-size:var(--fs-xs);transition:transform .15s}
  .ev .bub .thinkbox.open .th .ic{transform:rotate(90deg)}
  .ev .bub .thinkbox .tb{display:none;padding:0 10px 8px;font-size:var(--fs-sm);line-height:1.65;
    color:var(--fg-3);white-space:pre-wrap;word-break:break-word;max-height:340px;overflow:auto;
    font-family:inherit}
  .ev .bub .thinkbox.open .tb{display:block}

  /* ---------- 消息搜索 ---------- */
  #searchBar{display:none;align-items:center;gap:7px;padding:7px 14px;background:var(--chrome);
    border-bottom:1px solid var(--line);flex:none}
  #searchBar.show{display:flex}
  #searchBar input{flex:1;background:var(--card);color:var(--fg);border:1px solid var(--line-2);
    border-radius:var(--r-sm);padding:5px 10px;font:inherit;font-size:var(--fs-sm);outline:none}
  #searchBar input:focus{border-color:var(--pri)}
  #searchBar .cnt{color:var(--fg-3);font-size:var(--fs-xs);flex:none;min-width:64px;text-align:right}
  #searchBar button{padding:4px 9px;font-size:var(--fs-sm)}
  /* 命中的消息：加一圈提示色，当前选中的更亮 */
  .ev.hit .bub{box-shadow:0 0 0 2px color-mix(in srgb,var(--warn) 55%,transparent)}
  .ev.hit-cur .bub{box-shadow:0 0 0 2px var(--warn)}
  mark.hl{background:color-mix(in srgb,var(--warn) 45%,transparent);color:inherit;
    border-radius:var(--r-sm);padding:0 1px}

  /* 清空后的撤回条 */
  .undo{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);z-index:9000;
    display:flex;align-items:center;gap:10px;padding:8px 12px 8px 16px;
    background:var(--card);border:1px solid var(--line-2);border-radius:999px;
    box-shadow:var(--shadow-lg);font-size:var(--fs-sm);color:var(--fg)}
  .undo button{padding:3px 12px;font-size:var(--fs-sm);border-radius:999px;
    background:var(--pri-soft);border-color:var(--pri);color:var(--pri)}
  .undo .x{cursor:pointer;color:var(--fg-3);font-size:var(--fs-base);padding:0 2px}
  .undo .x:hover{color:var(--fg)}

  /* ---------- 错误横幅 ---------- */
  #banner{display:none;align-items:flex-start;gap:9px;padding:9px 14px;background:var(--err-bg);
    border-bottom:1px solid var(--err-line);color:var(--err);font-size:var(--fs-sm);flex:none}
  #banner.show{display:flex}
  #banner .ico{flex:none;line-height:1.4}
  #banner .txt{flex:1;word-break:break-word;line-height:1.5}
  #banner .x{cursor:pointer;opacity:.7;flex:none;font-size:var(--fs-md);line-height:1;padding:0 2px}
  #banner .x:hover{opacity:1}

  /* ---------- 参与者（chrome） ---------- */
  #peers{display:flex;gap:7px;flex-wrap:wrap;padding:8px 14px;background:var(--chrome);
    border-bottom:1px solid var(--line);flex:none;align-items:center;min-height:42px}
  #peers .lbl{color:var(--fg-3);font-size:var(--fs-xs);flex:none;letter-spacing:.3px}
  .chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--card);
    border-radius:999px;padding:3px 11px 3px 7px;font-size:var(--fs-sm);cursor:pointer;user-select:none;transition:.13s}
  .chip:hover{background:var(--hover)}
  .chip .av{width:16px;height:16px;border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;
    font-size:var(--fs-xs);font-weight:700;color:#fff;flex:none;background:hsl(var(--id-h) var(--id-sat) var(--id-light))}
  .chip .nm{max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .chip .p{color:var(--fg-3);font-size:var(--fs-xs)}
  .chip:not(.on){opacity:.5}
  .chip.on{border-color:var(--line-2)}
  .chip.now{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 12%,var(--card))}
  .chip.dead{opacity:.35;cursor:not-allowed}
  .chip.all{border-style:dashed;padding:3px 11px}
  .chip.all.on{border-style:solid;border-color:var(--pri);background:var(--pri-soft)}

  /* ---------- 消息区（canvas） ---------- */
  #msgs{flex:1;overflow:auto;padding:var(--s5) var(--s4) var(--s3);
    display:flex;flex-direction:column;gap:0}
  .empty{color:var(--fg-3);text-align:center;padding:64px var(--s4);font-size:var(--fs-sm);line-height:2}
  .empty b{color:var(--pri);font-weight:600}
  .empty kbd{background:var(--card);border:1px solid var(--line-2);border-radius:var(--r-sm);padding:1px 6px;
    font-size:var(--fs-xs);font-family:inherit;color:var(--fg-2)}

  /* 日期/时间分隔 */
  .daysep{display:flex;align-items:center;gap:10px;color:var(--fg-3);font-size:var(--fs-xs);
    margin:var(--s4) 0 var(--s3)}
  .daysep::before,.daysep::after{content:'';flex:1;height:1px;background:var(--line)}

  /* 一条消息
     间距节奏是聊天界面的骨架：
       - 同一人连续说话（.tail）：几乎贴着，形成一组
       - 换人说话：明显拉开
     改造前统一 5px，所有消息糊成一片，看不出哪是一条新消息。 */
  .ev{display:flex;gap:var(--s3);padding:0;max-width:100%;margin-top:var(--s3)}
  .ev:first-child{margin-top:0}
  .ev.tail{margin-top:2px}
  .ev.me{flex-direction:row-reverse}
  .ev .av{width:28px;height:28px;border-radius:var(--r-sm);flex:none;margin-top:2px;
    display:flex;align-items:center;justify-content:center;
    font-size:var(--fs-sm);font-weight:700;color:#fff;
    background:hsl(var(--id-h) var(--id-sat) var(--id-light));user-select:none}
  .ev .col{min-width:0;max-width:min(var(--bubble-max),78%)}
  .ev .hd{display:flex;align-items:baseline;gap:7px;margin-bottom:3px}
  .ev.me .hd{flex-direction:row-reverse}
  .ev .who{font-size:var(--fs-sm);font-weight:600;
    color:hsl(var(--id-h) var(--id-sat) calc(var(--id-light) + 8%))}
  :root.light .ev .who{color:hsl(var(--id-h) var(--id-sat) calc(var(--id-light) - 6%))}
  .ev .tm{font-size:var(--fs-xs);color:var(--fg-3);opacity:0;transition:opacity .15s}
  .ev:hover .tm{opacity:1}

  .ev .bub{background:var(--card);border-radius:var(--r-sm) var(--r-lg) var(--r-lg) var(--r-lg);
    padding:var(--s2) var(--s3);box-shadow:var(--shadow);
    overflow-wrap:break-word;word-break:break-word}
  .ev.me .bub{background:var(--self-bg);border:1px solid var(--self-line);
    border-radius:var(--r-lg) 4px var(--r-lg) var(--r-lg)}
  /* 连续同一人：收起头像与抬头，视觉上连成一组 */
  .ev.tail .av,.ev.tail .hd{visibility:hidden;height:0;margin:0;overflow:hidden}
  .ev.tail .bub{border-radius:var(--r-lg)}

  /* 系统/错误 */
  .ev.sys{justify-content:center;margin-top:var(--s2)}
  .ev.sys .bub{background:transparent;box-shadow:none;color:var(--fg-3);font-size:var(--fs-xs);
    text-align:center;border:1px dashed var(--line-2);border-radius:999px;
    padding:3px var(--s3);max-width:70%}
  .ev.sys.err .bub{border-color:var(--err-line);color:var(--err);border-style:solid;background:var(--err-bg)}

  /* 发送去向 */
  .ev .to{font-size:var(--fs-xs);color:var(--fg-3);margin-top:var(--s1);
    display:flex;align-items:center;gap:5px}
  .ev.me .to{justify-content:flex-end}
  .ev .to .ic{opacity:.7}
  .ev .to .ctxtag{opacity:.75;border-left:1px solid var(--line-2);padding-left:6px;margin-left:2px}

  /* ---------- Markdown ---------- */
  .md>*:first-child{margin-top:0}
  .md>*:last-child{margin-bottom:0}
  .md p{margin:0 0 .55em}
  .md h1,.md h2,.md h3,.md h4,.md h5,.md h6{margin:.9em 0 .45em;line-height:1.35;font-weight:650}
  .md h1{font-size:1.42em}
  .md h2{font-size:1.26em}
  .md h3{font-size:1.12em}
  .md h4,.md h5,.md h6{font-size:1em}
  .md ul,.md ol{margin:.4em 0 .6em;padding-left:1.5em}
  .md li{margin:.16em 0}
  .md li>ul,.md li>ol{margin:.16em 0}
  .md a{color:var(--pri);text-decoration:none;border-bottom:1px solid color-mix(in srgb,var(--pri) 40%,transparent)}
  .md a:hover{border-bottom-color:var(--pri)}
  .md strong{font-weight:650}
  .md code{font-family:ui-monospace,"Cascadia Code",Consolas,"Courier New",monospace;font-size:.9em;
    background:var(--code-bg);padding:.12em .38em;border-radius:var(--r-sm)}
  .md pre{background:var(--code-bg);border-radius:var(--r-md);padding:10px 12px;overflow:auto;margin:.55em 0;
    border:1px solid var(--line)}
  .md pre code{background:none;padding:0;font-size:var(--fs-sm);line-height:1.55}
  .md blockquote{border-left:3px solid var(--line-2);padding:.1em 0 .1em .85em;margin:.55em 0;color:var(--fg-2)}
  .md hr{border:none;border-top:1px solid var(--line);margin:.9em 0}
  .md table{border-collapse:collapse;margin:.55em 0;font-size:var(--fs-sm);display:block;overflow:auto;max-width:100%}
  .md th,.md td{border:1px solid var(--line-2);padding:5px 10px;text-align:left}
  .md th{background:var(--card-2);font-weight:600}
  .md img{max-width:100%;border-radius:var(--r-sm)}

  /* ---------- 附件（消息内） ---------- */
  .bub .att{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .bub .att img{max-width:210px;max-height:160px;border-radius:var(--r-md);display:block;cursor:zoom-in;
    border:1px solid var(--line-2)}
  .bub .att .f{display:inline-flex;align-items:center;gap:6px;background:var(--card-2);
    border:1px solid var(--line);border-radius:var(--r-sm);padding:5px 10px;font-size:var(--fs-sm)}

  /* ---------- 引用条 ---------- */
  #quoteBar{display:none;align-items:flex-start;gap:8px;margin-bottom:7px;padding:7px 10px;
    background:var(--card);border:1px solid var(--line-2);border-left:3px solid var(--pri);
    border-radius:var(--r-sm);font-size:var(--fs-sm)}
  #quoteBar.show{display:flex}
  #quoteBar .qcol{flex:1;min-width:0}
  #quoteBar .qw{color:var(--pri);font-weight:600;font-size:var(--fs-sm);margin-bottom:2px}
  #quoteBar .qt{color:var(--fg-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #quoteBar .qx{cursor:pointer;color:var(--fg-3);flex:none;font-size:var(--fs-md);line-height:1;padding:0 2px}
  #quoteBar .qx:hover{color:var(--err)}

  /* 消息上的操作按钮（默认隐藏，悬停出现） */
  .ev .acts{display:flex;gap:4px;align-self:flex-start;margin-top:6px;opacity:0;transition:opacity .13s}
  .ev:hover .acts{opacity:1}
  .ev.me .acts{order:-1}
  .ev .acts button{padding:2px 7px;font-size:var(--fs-xs);border-radius:var(--r-sm);background:var(--card);
    border:1px solid var(--line-2);color:var(--fg-2)}
  .ev .acts button:hover{background:var(--hover);color:var(--fg)}

  /* 消息内的引用（"回复某某"） */  .ev .bub .qref{display:block;margin:-2px 0 7px;padding:5px 9px;border-left:2px solid var(--line-2);
    background:var(--code-bg);border-radius:0 6px 6px 0;font-size:var(--fs-sm);color:var(--fg-2);
    cursor:pointer;transition:border-color .13s}
  .ev .bub .qref:hover{border-left-color:var(--pri)}
  .ev .bub .qref .qw{color:var(--pri);font-weight:600;margin-right:5px}
  .ev .bub .qref .qt{white-space:pre-wrap;word-break:break-word;
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  /* 被跳转高亮 */
  .ev.flash .bub{box-shadow:0 0 0 2px var(--pri)}

  /* ---------- 等待指示 ---------- */
  .typing{display:inline-flex;gap:4px;align-items:center;color:var(--fg-2);font-size:var(--fs-sm)}
  .typing b{width:5px;height:5px;border-radius:50%;background:currentColor;animation:tp 1.3s infinite}
  .typing b:nth-child(2){animation-delay:.18s}
  .typing b:nth-child(3){animation-delay:.36s}
  @keyframes tp{0%,60%,100%{opacity:.22}30%{opacity:1}}

  /* ---------- 流式输出 ---------- */
  /* 正在生成的气泡：左边一条流动的光带，末尾一个光标 */
  .ev.streaming .bub{position:relative;overflow:hidden}
  .ev.streaming .bub::before{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;
    background:linear-gradient(180deg,transparent,var(--pri),transparent);
    animation:flow 1.4s linear infinite}
  @keyframes flow{0%{transform:translateY(-100%)}100%{transform:translateY(100%)}}
  .cursor{display:inline-block;width:2px;height:1.05em;vertical-align:-.16em;margin-left:2px;
    background:var(--pri);animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .stream-dots{display:inline-flex;gap:3px;align-items:center;margin-left:7px;vertical-align:middle}
  .stream-dots i{width:4px;height:4px;border-radius:50%;background:var(--pri);animation:tp 1.1s infinite}
  .stream-dots i:nth-child(2){animation-delay:.15s}
  .stream-dots i:nth-child(3){animation-delay:.3s}
  /* SSE 连接状态：断了会退回轮询，给用户一个可见交代 */
  #sse{display:inline-flex;align-items:center;gap:5px;font-size:var(--fs-xs);color:var(--fg-3);flex:none;
    cursor:default;user-select:none}
  #sse i{width:5px;height:5px;border-radius:50%;background:var(--fg-3);flex:none}
  #sse.on i{background:var(--ok)}
  #sse.off i{background:var(--warn)}

  /* ---------- 附件预览区 ---------- */
  #atts{display:flex;gap:8px;flex-wrap:wrap;padding:0 14px;background:var(--chrome);flex:none}
  #atts:not(:empty){padding:10px 14px;border-top:1px solid var(--line)}
  .at{position:relative;border:1px solid var(--line-2);border-radius:var(--r-md);background:var(--card);
    padding:5px 8px;display:flex;align-items:center;gap:8px;font-size:var(--fs-sm);max-width:240px}
  .at img{width:40px;height:40px;object-fit:cover;border-radius:var(--r-sm);flex:none}
  .at .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .at .sz{color:var(--fg-3);font-size:var(--fs-xs);flex:none}
  .at .x{cursor:pointer;color:var(--fg-3);font-size:var(--fs-base);line-height:1;flex:none;padding:0 2px}
  .at .x:hover{color:var(--err)}
  .at.st{opacity:.5}

  /* ---------- 输入区（chrome + 卡片） ---------- */
  #composer{flex:none;background:var(--chrome);border-top:1px solid var(--line);padding:10px 14px 11px;position:relative}
  #sendTo{font-size:var(--fs-xs);color:var(--fg-3);margin-bottom:7px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  #sendTo .tg{cursor:pointer;background:var(--card);border:1px solid var(--line-2);border-radius:999px;
    padding:1px 9px;color:var(--fg-2);transition:.12s}
  #sendTo .tg:hover{color:var(--err);border-color:var(--err-line)}
  #sendTo .none{color:var(--err)}
  /* 发言方式切换：并行 / 串行 */
  #sendTo .modepick{display:inline-flex;align-items:center;gap:3px;flex:none}
  #sendTo .modepick .ml{color:var(--fg-3);font-size:var(--fs-xs)}
  #sendTo .modepick .mb{cursor:pointer;padding:1px 7px;border-radius:999px;font-size:var(--fs-xs);
    color:var(--fg-3);border:1px solid transparent;transition:.12s}
  #sendTo .modepick .mb:hover{color:var(--fg-2);background:var(--card)}
  #sendTo .modepick .mb.on{background:var(--pri-soft);color:var(--pri);border-color:var(--pri)}
  /* 上下文条数选择器 */
  #sendTo .ctxpick{display:inline-flex;align-items:center;gap:3px;margin-left:auto;flex:none}
  #sendTo .ctxpick .cl{color:var(--fg-3);font-size:var(--fs-xs)}
  #sendTo .ctxpick .cb{cursor:pointer;padding:1px 7px;border-radius:999px;font-size:var(--fs-xs);
    color:var(--fg-3);border:1px solid transparent;transition:.12s}
  #sendTo .ctxpick .cb:hover{color:var(--fg-2);background:var(--card)}
  #sendTo .ctxpick .cb.on{background:var(--pri-soft);color:var(--pri);border-color:var(--pri)}
  .box{display:flex;gap:8px;align-items:flex-end;background:var(--card);border:1px solid var(--line-2);
    border-radius:var(--radius);padding:6px 8px;transition:border-color .15s,box-shadow .15s}
  .box:focus-within{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-soft)}
  #input{
    flex:1;background:transparent;color:var(--fg);border:none;outline:none;
    padding:6px 4px;font:inherit;font-size:var(--fs-base);resize:none;
    min-height:30px;max-height:200px;line-height:1.58;
  }
  #input::placeholder{color:var(--fg-3)}
  .box .sendbtn{background:var(--pri);border-color:var(--pri);color:var(--pri-fg);border-radius:var(--r-md);
    padding:6px 15px;font-weight:500}
  .box .sendbtn:hover:not(:disabled){filter:brightness(1.1)}

  /* @ 下拉 */
  #mention{position:absolute;left:14px;bottom:100%;margin-bottom:8px;background:var(--card);
    border:1px solid var(--line-2);border-radius:var(--radius);box-shadow:var(--shadow-lg);
    min-width:260px;max-height:280px;overflow:auto;display:none;z-index:20;padding:4px}
  #mention.show{display:block}
  #mention .it{padding:7px 10px;cursor:pointer;display:flex;align-items:center;gap:9px;font-size:var(--fs-sm);
    border-radius:var(--r-sm)}
  #mention .it:hover,#mention .it.sel{background:var(--pri-soft)}
  #mention .it .av{width:20px;height:20px;border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;
    font-size:var(--fs-xs);font-weight:700;color:#fff;flex:none;background:hsl(var(--id-h) var(--id-sat) var(--id-light))}
  #mention .it .p{color:var(--fg-3);font-size:var(--fs-xs);margin-left:auto}
  #mention .hd{padding:6px 10px;color:var(--fg-3);font-size:var(--fs-xs);border-bottom:1px solid var(--line);margin-bottom:4px}

  /* 拖拽遮罩 */
  #drop{position:fixed;inset:0;background:color-mix(in srgb,var(--pri) 12%,transparent);
    border:2px dashed var(--pri);display:none;align-items:center;justify-content:center;
    font-size:var(--fs-lg);color:var(--pri);z-index:99;pointer-events:none;font-weight:500}
  #drop.show{display:flex}

  /* 图片灯箱 */
  #lightbox{position:fixed;inset:0;background:rgba(0,0,0,.82);display:none;align-items:center;
    justify-content:center;z-index:200;cursor:zoom-out;padding:40px}
  #lightbox.show{display:flex}
  #lightbox img{max-width:100%;max-height:100%;border-radius:var(--r-md);box-shadow:var(--shadow-lg)}

  button.busy{position:relative;color:transparent!important}
  button.busy::after{content:'';position:absolute;left:50%;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;
    border:2px solid rgba(255,255,255,.32);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  footer{flex:none;padding:5px 14px;background:var(--chrome);border-top:1px solid var(--line);
    color:var(--fg-3);font-size:var(--fs-xs);display:flex;gap:12px;align-items:center}
  footer .sp{flex:1}
  kbd{background:var(--card);border:1px solid var(--line-2);border-radius:var(--r-sm);padding:0 5px;
    font-size:var(--fs-xs);font-family:inherit;color:var(--fg-2)}
</style>

<body>
  <header>
    <!-- 左组：身份 + 话题。这两样回答「这是哪个房间、哪个话题」，最该一眼看到 -->
    <div class="hg hg-left">
      <i id="dot"></i>
      <h1>多 AI 同室</h1>
      <div id="topicWrap">
        <div id="topicBtn" title="切换话题（不同话题互不干扰）">
          <span class="tn" id="topicName">默认</span>
          <span class="tc">▼</span>
        </div>
      </div>
    </div>

    <!-- 右组：状态 + 操作。
         改造前 11 个元素平铺一行，密集到分不清谁是谁。
         现在按「状态」与「操作」分开，中间弹性隔开；
         低频项（占用、刷新、清空）收进「⋯」菜单，常用的留在外面。 -->
    <div class="hg hg-right">
      <div id="sse" class="off" title="流式输出连接状态"><i></i><span id="sse-txt">连接中</span></div>
      <div id="relayWrap" title="开启后：AI 回复里 @ 别人会自动转发给对方（最多 3 跳，防止失控）">
        <div id="relaySw"></div><span>接力</span>
      </div>
      <div id="status">正在连接…</div>
      <button id="btn-plan" class="icon" title="分工讨论：让成员各自提案、互相挑错，最后出一张分工表">📋</button>
      <button id="btn-search" class="icon" title="搜索消息（Ctrl+F）">🔍</button>
      <div id="moreWrap">
        <button id="btn-more" class="icon" title="更多">⋯</button>
        <div id="moreMenu">
          <div class="mi" id="mi-action"><span>⚙ 显示动作</span><b id="actionState">关</b></div>
          <div class="mi" id="mi-claims"><span>📄 被改动的文件</span><b id="claimN">0</b></div>
          <div class="mi" id="mi-refresh"><span>↻ 刷新</span></div>
          <div class="mi danger" id="mi-clear"><span>🗑 清空本话题</span></div>
        </div>
      </div>
    </div>
  </header>

  <div id="searchBar">
    <input type="text" id="searchInput" placeholder="搜索本话题的消息…（Enter 下一个，Esc 关闭）">
    <span class="cnt" id="searchCnt"></span>
    <button id="searchPrev" title="上一个（Shift+Enter）">↑</button>
    <button id="searchNext" title="下一个（Enter）">↓</button>
    <button id="searchClose" title="关闭（Esc）">✕</button>
  </div>

  <!-- 话题菜单放在 body 直下，不放在 header 里：
       header 是横向 flex 且有固定高度，绝对/固定定位的菜单容易被裁切或遮挡。 -->
  <div id="topicMenu"></div>

  <div id="cfmMask">
    <div id="cfmBox">
      <div class="ct" id="cfmTitle">确认</div>
      <div class="cm" id="cfmMsg"></div>
      <div class="cb">
        <button id="cfmNo">取消</button>
        <button id="cfmYes" class="ok">确定</button>
      </div>
    </div>
  </div>

  <div id="peers"><span class="lbl">参与者</span></div>

  <div id="banner">
    <span class="ico">⚠</span>
    <span class="txt" id="banner-txt"></span>
    <span class="x" id="banner-x" title="关闭">✕</span>
  </div>

  <div id="msgs"></div>

  <div id="atts"></div>

  <div id="composer">
    <div id="mention"></div>
    <div id="sendTo"></div>
    <div id="planProg">
      <span class="stg" id="planStage">准备中</span>
      <div class="bar"><i id="planBarFill" style="width:0%"></i></div>
      <span id="planCount"></span>
      <span class="stop" id="planStop">停止</span>
    </div>
    <div id="planBar">
      <div class="ph">📋 分工讨论</div>
      <div class="pt">描述你想做什么。成员会分三步：各自提案 → 交叉挑错 → 合成一张分工表。
        <b>不会自动开工</b>，表出来由你定。</div>
      <textarea id="planTask" placeholder="例如：给这个项目加一个导出 CSV 的功能。只描述目标，不用自己拆任务。"></textarea>
      <div class="pb">
        <span class="cost" id="planCost"></span>
        <button id="planCancel">取消</button>
        <button id="planGo" class="pri">开始</button>
      </div>
    </div>
    <div id="quoteBar">
      <div class="qcol">
        <div class="qw" id="quoteWho"></div>
        <div class="qt" id="quoteText"></div>
      </div>
      <span class="qx" id="quoteX" title="取消引用">✕</span>
    </div>
    <div class="box">
      <button id="btn-attach" class="icon" title="添加图片或文件">📎</button>
      <textarea id="input" rows="1" placeholder="输入消息…  用 @ 指定对话对象，Enter 发送"></textarea>
      <button id="btn-send" class="sendbtn">发送</button>
    </div>
    <input type="file" id="filePick" multiple style="display:none">
  </div>

  <div id="drop">松手即添加到待发送附件</div>
  <div id="lightbox"><img id="lightbox-img" alt=""></div>

  <footer>
    <span id="foot">—</span>
    <span class="sp"></span>
    <span><kbd>Enter</kbd> 发送 · <kbd>Shift</kbd>+<kbd>Enter</kbd> 换行 · <kbd>@</kbd> 选人</span>
  </footer>

<script>
(function () {
  'use strict';

  var TOKEN = '__ROOM_TOKEN__';
  var PORT = __ROOM_PORT__;
  var MAX_ATTACH_MB = __ROOM_MAX_ATTACH__;

  var $ = function (id) { return document.getElementById(id); };
  var dot = $('dot'), statusEl = $('status'), peersEl = $('peers'), msgsEl = $('msgs');
  var attsEl = $('atts'), inputEl = $('input'), sendToEl = $('sendTo'), mentionEl = $('mention');
  var btnSend = $('btn-send'), btnAttach = $('btn-attach');

  /**
   * 危险操作确认。返回 Promise<boolean>。

   * 而且它阻塞渲染进程，这里用异步框更合适。
   */
  var cfmResolve = null;
  function askConfirm(title, message) {

  });

  function setError(msg) {

    else { bannerEl.className = ''; bannerTxt.textContent = ''; }
  }

  if (typeof window !== 'undefined' && window.addEventListener) {

  var state = {

    selected: {},

    topics: [],
    activeTopic: '',

    relay: false,
