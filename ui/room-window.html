    claims: [],
  };

  // ===================== 通信 =====================
  function api(path, opts) {
    var o = opts || {};
    return fetch('http://127.0.0.1:' + PORT + path, {
      method: o.method || 'GET',
      headers: { 'Authorization': 'Bearer ' + TOKEN, 'Content-Type': 'application/json' },
      body: o.body ? JSON.stringify(o.body) : undefined
    }).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    });
  }

  // ===================== 工具 =====================
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined && text !== null) n.textContent = String(text);
    return n;
  }
  function fmtSize(b) {
    if (b < 1024) return b + ' B';
    if (b < 1048576) return (b / 1024).toFixed(1) + ' KB';
    return (b / 1048576).toFixed(1) + ' MB';
  }
  function fmtTime(t) {
    try {
      var d = new Date(t);
      return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
    } catch (e) { return ''; }
  }
  function fmtDay(t) {
    try {
      var d = new Date(t), n = new Date();
      var same = d.toDateString() === n.toDateString();
      if (same) return '今天';
      var y = new Date(n.getTime() - 86400000);
      if (d.toDateString() === y.toDateString()) return '昨天';
      return (d.getMonth() + 1) + '月' + d.getDate() + '日';
    } catch (e) { return ''; }
  }
  function isImg(mime, name) {
    if (mime && /^image\//.test(mime)) return true;
    return /\.(png|jpe?g|gif|webp|bmp|svg)$/i.test(name || '');
  }
  function peers() { return state.windows.filter(function (w) { return !w.isSubagent; }); }
  function targetList() {
    var ids = Object.keys(state.selected).filter(function (k) { return state.selected[k]; });
    if (!ids.length) return peers().filter(function (w) { return w.canInject; });
    return peers().filter(function (w) { return state.selected[w.windowId] && w.canInject; });
  }

  /** 身份色：由 windowId 稳定派生一个色相，写进 --id-h 交给 CSS 计算明度 */
  function hueOf(id) {
    var HUES = [212, 158, 276, 24, 338, 190, 44, 118, 258, 6];
    var n = Number(id);
    if (!isFinite(n)) n = String(id || '').split('').reduce(function (a, c) { return a + c.charCodeAt(0); }, 0);
    return HUES[Math.abs(n) % HUES.length];
  }
  /**
   * 头像上显示什么。
   *
   * 优先用 mention 的序号（deepseek-1 → 1）：
   * 两个 DeepSeek 窗口的标题都以 D 开头，用首字母永远都是「D」，
   * 分不清谁是谁。序号是唯一的，一眼可辨。
   * 没有 mention 时退回首字母/汉字。
   */
  function initialOf(label, mention) {
    if (mention) {
      var mm = String(mention).match(/(\d+)$/);
      if (mm) return mm[1];
    }
    var s = String(label || '?').trim();
    var m = s.match(/[\u4e00-\u9fa5]/);
    if (m) return m[0];
    return (s.charAt(0) || '?').toUpperCase();
  }

  // ===================== Markdown（白名单重建式消毒） =====================
  /**
   * AI 的回复是**第三方内容**。把 marked 的输出直接 innerHTML 等于开 XSS 后门。
   * 这里不用正则（正则做 HTML 消毒必被绕过），而是**解析成 DOM 后按白名单重建**：
   * 只创建允许的标签、只复制允许的属性，其余一律丢弃。
   *
   * 故意不允许 img：AI 若输出 ![](http://x/y.png)，会在打开消息时自动发起请求，
   * 等于把"你是否看了这条消息"泄露给第三方。要图可以点链接跳浏览器看。
   */
  var ALLOWED = {
    P: [], BR: [], HR: [],
    H1: [], H2: [], H3: [], H4: [], H5: [], H6: [],
    UL: [], OL: [], LI: [],
    STRONG: [], B: [], EM: [], I: [], DEL: [], S: [], CODE: [],
    PRE: [], BLOCKQUOTE: [],
    TABLE: [], THEAD: [], TBODY: [], TR: [], TH: [], TD: [],
    A: ['href', 'title'],
  };

  function safeHref(href) {
    var h = String(href || '').trim();
    // 只允许 http/https：挡掉 javascript: data: vbscript: file: 等
    return /^https?:\/\//i.test(h) ? h : null;
  }

  function sanitize(node, out) {
    var kids = node.childNodes || [];
    for (var i = 0; i < kids.length; i++) {
      var n = kids[i];
      if (n.nodeType === 3) {                       // 文本
        out.appendChild(document.createTextNode(n.nodeValue));
        continue;
      }
      if (n.nodeType !== 1) continue;               // 注释等一律丢
      var tag = String(n.tagName || '').toUpperCase();
      var attrs = ALLOWED[tag];
      if (!attrs) continue;                         // 不在白名单：整棵子树丢弃
      var e = document.createElement(tag);
      for (var k = 0; k < attrs.length; k++) {
        var v = n.getAttribute && n.getAttribute(attrs[k]);
        if (v == null) continue;
        if (attrs[k] === 'href') {
          var ok = safeHref(v);
          if (ok) { e.setAttribute('href', ok); e.setAttribute('rel', 'noreferrer noopener'); }
        } else {
          e.setAttribute(attrs[k], v);
        }
      }
      sanitize(n, e);
      out.appendChild(e);
    }
  }

  function renderMarkdown(text) {
    var box = el('div', 'md');
    var src = String(text == null ? '' : text);
    if (!src) return box;
    var html = null;
    try {
      if (window.marked && typeof window.marked.parse === 'function') {
        html = window.marked.parse(src, { gfm: true, breaks: true });
        // marked 新版可能返回 Promise（异步扩展）；拿到 Promise 说明用法不对，
        // 当作解析失败处理，而不是把 "[object Promise]" 渲染出去
        if (html && typeof html.then === 'function') html = null;
        // 解析成功 → 清掉之前的失败标记，让横幅能自己收回去
        if (html != null && markdownBroken) { markdownBroken = false; markdownWarned = false; setError(''); }
      }
    } catch (e) { html = null; }
    if (html == null) {
      // 回退纯文本时**必须留痕**：否则「marked 没加载上」会表现成
      // 「Markdown 不生效但界面一切正常」，排查时毫无线索。
      markdownBroken = true;
      // 顺手尝试补载一次（页面初次加载时服务可能还没起来）
      ensureMarked();
      box.appendChild(document.createTextNode(src));
      return box;
    }
    var tpl = document.createElement('div');
    tpl.innerHTML = html;                           // 游离节点：不执行脚本、不加载资源
    sanitize(tpl, box);
    return box;
  }
  /** marked 是否加载失败（首次渲染时探测，用于在界面上给出可见提示） */
  var markdownBroken = false;
  var markdownWarned = false;
  var markedLoading = false;

  /**
   * 补载 marked。
   *
   * 为什么需要它：<script src="/vendor/marked.umd.js"> 是页面加载时一次性拉取的。
   * 如果那一刻服务还没起来（或网络抖动），window.marked 就永远缺席，除非用户重开窗口——
   * 而用户根本不知道该这么做。这里改成按需重试：拉到了就地生效，不用重开。
   */
  function ensureMarked() {
    if (markedLoading) return;
    if (window.marked && typeof window.marked.parse === 'function') return;
    markedLoading = true;
    try {
      var s = document.createElement('script');
      s.src = '/vendor/marked.umd.js?retry=' + Date.now();
      s.onload = function () {
        markedLoading = false;
        if (window.marked && typeof window.marked.parse === 'function') {
          markdownBroken = false;
          markdownWarned = false;
          setError('');
          // 重绘一遍，把已经渲染成纯文本的消息换成 Markdown
          state.seen = {};
          msgsEl.textContent = '';
          state.lastCount = 0;
          renderMsgs();
          renderStatus();
        }
      };
      s.onerror = function () { markedLoading = false; };
      document.head.appendChild(s);
    } catch (e) { markedLoading = false; }
  }

  // ===================== 渲染：参与者 =====================
  function renderPeers() {
    peersEl.textContent = '';
    peersEl.appendChild(el('span', 'lbl', '参与者'));
    if (!state.alive) { peersEl.appendChild(el('span', 'lbl', state.error || '未连接')); return; }
    var list = peers();
    if (!list.length) { peersEl.appendChild(el('span', 'lbl', '没有可用窗口')); return; }

    var busyList = state.chat.busy || [];
    var nowId = busyList.length === 1 ? busyList[0] : null;

    list.forEach(function (w) {
      var c = el('span', 'chip');
      c.style.setProperty('--id-h', hueOf(w.windowId));
      c.appendChild(el('span', 'av', initialOf(w.title || w.providerId)));
      c.appendChild(el('span', 'nm', w.title || w.url || ('窗口 ' + w.windowId)));
      c.appendChild(el('span', 'p', w.providerId || '?'));
      if (!w.canInject) c.className += ' dead';
      else if (state.selected[w.windowId]) c.className += ' on';
      if (w.windowId === nowId) c.className += ' now';
      if (w.canInject) {
        c.title = state.selected[w.windowId] ? '点击取消选中' : '点击选中';
        c.addEventListener('click', function () {
          state.selected[w.windowId] = !state.selected[w.windowId];
          renderPeers(); renderSendTo();
        });
      }
      peersEl.appendChild(c);
    });

    var allOn = list.length > 0 && list.every(function (w) { return !w.canInject || state.selected[w.windowId]; });
    var a = el('span', 'chip all' + (allOn ? ' on' : ''));
    a.appendChild(el('span', null, allOn ? '取消全体' : '全体'));
    a.addEventListener('click', function () {
      var on = !allOn;
      list.forEach(function (w) { if (w.canInject) state.selected[w.windowId] = on; });
      renderPeers(); renderSendTo();
    });
    peersEl.appendChild(a);
  }

  function renderSendTo() {
    sendToEl.textContent = '';
    var t = targetList();
    sendToEl.appendChild(el('span', null, '发送给'));
    if (!t.length) { sendToEl.appendChild(el('span', 'none', '没有可用的对话对象')); return; }
    t.forEach(function (w) {
      var g = el('span', 'tg', '@' + (w.title || w.providerId));
      g.title = '点击移除';
      g.addEventListener('click', function () {
        state.selected[w.windowId] = false;
        renderPeers(); renderSendTo();
      });
      sendToEl.appendChild(g);
    });
    sendToEl.appendChild(renderCtxPicker());
    sendToEl.appendChild(renderModePicker());
  }

  /**
   * 发言方式选择器。
   *
   * 为什么必须给这个开关：并行时两条消息同时发出，谁也不知道对方会说什么，
   * 于是两个成员会干同一件事（实测：两位都在看同一个项目，各自 read/grep/bash）。
   * 串行让后一位看到前一位的结论，代价是总时长相加。
   * 这种事该让用户按任务自己决定，不该替他猜。
   */
  var MODE_KEY = 'cuckoo.room.mode';
  var ACTION_KEY = 'cuckoo.room.showAction';

  function loadMode() {
    try {
      var v = localStorage.getItem(MODE_KEY);
      if (v === 'sequential' || v === 'parallel') return v;
    } catch (e) {}
    // 默认「排队」。
    // 实测并行时两个成员会干同一件事（都在看同一个项目、各自 read/grep），
    // 重复劳动的代价远大于多等一会儿。要快就手动切「同时」。
    return 'sequential';
  }

  function renderModePicker() {
    var box = el('span', 'modepick');
    box.appendChild(el('span', 'ml', '方式'));
    var opts = [
      ['parallel', '同时', '所有人同时开工。快，但互相看不见对方在做什么'],
      ['sequential', '排队', '一个一个来，后一位能看到前一位的回答（总时长相加）'],
    ];
    opts.forEach(function (o) {
      var on = state.mode === o[0];
      var b = el('span', 'mb' + (on ? ' on' : ''), o[1]);
      b.title = o[2];
      b.addEventListener('click', function () {
        state.mode = o[0];
        try { localStorage.setItem(MODE_KEY, o[0]); } catch (e) {}
        renderSendTo();
      });
      box.appendChild(b);
    });
    return box;
  }

  /** 上下文条数选择器。
   *
   * 为什么要露出来：此前硬编码 14 条，用户既看不见也不知道 AI 到底看到了什么。
   * 条数直接影响 token 消耗与 AI 的理解质量，应该让人可控。
   */
  var CTX_KEY = 'cuckoo.room.ctxLimit';
  var CTX_OPTIONS = [0, 6, 14, 30];

  function loadCtxLimit() {
    try {
      var v = parseInt(localStorage.getItem(CTX_KEY), 10);
      if (Number.isFinite(v) && v >= 0 && v <= 60) return v;
    } catch (e) {}
    return 14;   // 与服务端默认值保持一致
  }
  function renderCtxPicker() {
    var box = el('span', 'ctxpick');
    box.appendChild(el('span', 'cl', '上下文'));
    CTX_OPTIONS.forEach(function (n) {
      var on = state.ctxLimit === n;
      var b = el('span', 'cb' + (on ? ' on' : ''), n === 0 ? '关' : String(n));
      b.title = n === 0
        ? '不带历史，只发本次内容（最省 token）'
        : ('发送时自动附带最近 ' + n + ' 条记录，让 AI 知道前因后果');
      b.addEventListener('click', function () {
        state.ctxLimit = n;
        // 独立窗口没有 ctx（那是插件实例的 API），用 localStorage 记住选择。
        // 页面来自 http://127.0.0.1:<port>，同源即可，端口变了会重置——可接受。
        try { localStorage.setItem(CTX_KEY, String(n)); } catch (e) {}
        renderSendTo();
      });
      box.appendChild(b);
    });
    return box;
  }

  // ===================== 渲染：消息 =====================
  function sameGroup(prev, m) {
    if (!prev) return false;
    if (prev.role !== m.role) return false;
    if (m.role === 'system') return false;
    if (prev.who !== m.who) return false;
    return (m.at - prev.at) < 5 * 60 * 1000;
  }

  function renderMsgs() {
    var ms = topicMessages();
    var prevCount = state.lastCount || 0;
    // 记录被清空（或换了一轮）→ 整体重绘
    if (ms.length < prevCount) { msgsEl.textContent = ''; state.seen = {}; }
    state.lastCount = ms.length;

    var busy = (state.chat.busy || []).length;
    var streaming = Object.keys(state.streams).length > 0;
    var working = !!(state.chat.sending || busy || streaming);

    if (!ms.length && !working) {
      if (!msgsEl.querySelector('.empty')) {
        msgsEl.textContent = '';
        var e = el('div', 'empty');
        e.appendChild(el('span', null, '在下面输入消息，用 '));
        e.appendChild(el('b', null, '@'));
        e.appendChild(el('span', null, ' 选择要发给谁。'));
        e.appendChild(document.createElement('br'));
        e.appendChild(el('span', null, '可以拖入图片或文件，也可以直接粘贴截图。'));
        msgsEl.appendChild(e);
      }
      return;
    }
    var emp = msgsEl.querySelector('.empty');
    if (emp) emp.remove();

    var stick = msgsEl.scrollTop + msgsEl.clientHeight >= msgsEl.scrollHeight - 90;

    for (var i = 0; i < ms.length; i++) {
      var m = ms[i];
      if (state.seen[m.id]) continue;
      state.seen[m.id] = true;
      var prev = i > 0 ? ms[i - 1] : null;
      // 跨天插一个分隔
      if (prev && new Date(prev.at).toDateString() !== new Date(m.at).toDateString()) {
        msgsEl.appendChild(el('div', 'daysep', fmtDay(m.at)));
      }
      var node = buildMsg(m);
      // 动作消息在「不显示动作」时返回 null：跳过，但 seen 已置位，
      // 所以不会反复重试；打开开关时会整体重绘。
      if (!node) continue;
      if (sameGroup(prev, m)) node.className += ' tail';
      msgsEl.appendChild(node);
    }

    var old = msgsEl.querySelector('.running');
    if (old) old.remove();
    // 有流式气泡时不显示"等待"占位——那会让同一个人出现两个气泡
    if (working && !Object.keys(state.streams).length) {
      var r = el('div', 'ev sys running');
      var b = el('div', 'bub');
      var tp = el('span', 'typing');
      tp.appendChild(el('span', null, busy ? ('等待 ' + busy + ' 位回复') : '正在发送'));
      tp.appendChild(el('b')); tp.appendChild(el('b')); tp.appendChild(el('b'));
      b.appendChild(tp);
      r.appendChild(b);
      msgsEl.appendChild(r);
    }
    if (stick) msgsEl.scrollTop = msgsEl.scrollHeight;

    // 流式节点可能在整树重绘时被清掉，这里补回来
    if (Object.keys(state.streams).length) renderStreams();

    // marked 没加载上 → 在界面上说清楚，而不是让用户对着字面星号猜
    if (markdownBroken && !markdownWarned) {
      markdownWarned = true;
      setError('Markdown 渲染库未加载，消息暂以纯文本显示。正在自动重试…');
      renderStatus();
    }
  }

  function buildMsg(m) {
    if (m.role === 'system') {
      var s = el('div', 'ev sys' + (m.err ? ' err' : ''));
      s.setAttribute('data-mid', m.id);
      s.appendChild(el('div', 'bub', m.text));
      return s;
    }
    // 动作：AI 打算做什么（工具调用轮）。
    //
    // 默认**不显示**。原因是它的内容是原始 JS（const g1 = await grep(...)），
    // 铺在聊天流里既难读又喧宾夺主——用户要的是对话，不是执行日志。
    //
    // 但数据必须保留：防撞车靠它解析文件占用，/claims/status 也要用。
    // 所以这里只是不渲染，想看的时候可以打开「动作」开关。
    if (m.role === 'action') {
      if (!state.showAction) return null;
      var a = el('div', 'ev act');
      a.setAttribute('data-mid', m.id);
      a.style.setProperty('--id-h', hueOf(m.windowId));
      a.appendChild(el('div', 'av', initialOf(m.who, m.mention)));
      var acol = el('div', 'col');
      var ahd = el('div', 'hd');
      ahd.appendChild(el('span', 'who', m.who || 'AI'));
      ahd.appendChild(el('span', 'tm', fmtTime(m.at)));
      acol.appendChild(ahd);
      var abub = el('div', 'bub', m.text || '');
      acol.appendChild(abub);
      // 这条动作声明占用了哪些文件（写操作才有）
      if (m.claims && m.claims.length) {
        var cb = el('div', 'claims');
        m.claims.forEach(function (p) {
          var f = el('span', 'cf', p);
          f.title = '这个文件已被 ' + (m.mention || m.who || '某位') + ' 改动';
          cb.appendChild(f);
        });
        acol.appendChild(cb);
      }
      // 原始文本比摘要长时，给个"看全文"
      if (m.actionRaw && m.actionRaw.length > (m.text || '').length + 20) {
        var more = el('button', 'actmore', '看全文');
        more.addEventListener('click', function (e) {
          e.stopPropagation();
          var open = more.textContent === '收起';
          abub.textContent = open ? (m.text || '') : m.actionRaw;
          more.textContent = open ? '看全文' : '收起';
        });
        ahd.appendChild(more);
      }
      a.appendChild(acol);
      return a;
    }
    var me = m.role === 'user';
    var d = el('div', 'ev ' + (me ? 'me' : 'ai'));
    d.setAttribute('data-mid', m.id);
    d.style.setProperty('--id-h', me ? 212 : hueOf(m.windowId));

    d.appendChild(el('div', 'av', me ? '我' : initialOf(m.who, m.mention)));

    var col = el('div', 'col');
    var hd = el('div', 'hd');
    hd.appendChild(el('span', 'who', m.who || (me ? '我' : 'AI')));
    // 成员的唯一 @ 名：两个同名平台的窗口靠它区分
    if (m.mention) {
      var mnEl = el('span', 'mn', '@' + m.mention);
      mnEl.title = '在输入框里 @' + m.mention + ' 可指定发给这位';
      hd.appendChild(mnEl);
    }
    hd.appendChild(el('span', 'tm', fmtTime(m.at)));
    col.appendChild(hd);

    var bub = el('div', 'bub');

    // 思考过程：默认折叠。
    //
    // 为什么不直接铺开：DeepSeek 的 reasoning 动辄上万字，铺开会把正文冲掉，
    // 用户反而找不到答案。折叠成一行「思考了 N 字」，想看再点。
    // 注意：这不是所有平台都有——DeepSeek 要开「深度思考」才有，
    // 没思考过程时整块不渲染，不要留空白。
    if (!me && m.think) {
      var tb = el('div', 'thinkbox');
      var th = el('div', 'th');
      th.appendChild(el('span', 'ic', '▶'));
      th.appendChild(el('span', null, '思考了 ' + m.think.length + ' 字'));
      var tbody = el('div', 'tb', m.think);
      th.addEventListener('click', function (e) {
        e.stopPropagation();
        tb.className = tb.className.indexOf('open') >= 0 ? 'thinkbox' : 'thinkbox open';
      });
      tb.appendChild(th);
      tb.appendChild(tbody);
      bub.appendChild(tb);
    }

    // 接力来的消息：标一下来源
    if (!me && m.relayed) {
      bub.appendChild(el('div', 'relay-tag', '接力 · 其他成员发来的'));
    }

    // 分工表：加个醒目标记和「复制表格」按钮。
    // 表格是 Markdown，直接选中复制会带走界面排版；
    // 单独复制原文，才能直接粘进文档或交给别的工具。
    if (!me && m.isPlan) {
      var planHd = el('div', 'planhint');
      planHd.appendChild(el('span', null, '📋 分工表'));
      var cpBtn = el('button', null, '复制表格');
      cpBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        copyText(m.text || '', cpBtn);
      });
      planHd.appendChild(cpBtn);
      bub.appendChild(planHd);
    }

    // 被引用原文：显示在气泡最上方，点了能跳回那条消息
    if (m.quote && m.quote.text) {
      var qr = el('div', 'qref');
      qr.appendChild(el('span', 'qw', m.quote.who || '上文'));
      qr.appendChild(el('span', 'qt', m.quote.text));
      qr.title = '点击跳到被引用的消息';
      (function (qid) {
        qr.addEventListener('click', function (e) { e.stopPropagation(); jumpTo(qid); });
      })(m.quote.id);
      bub.appendChild(qr);
    }

    if (me) bub.appendChild(el('span', null, m.text || ''));
    else bub.appendChild(renderMarkdown(m.text));
    bub.style.whiteSpace = me ? 'pre-wrap' : 'normal';

    if (m.attach && m.attach.length) {
      var box = el('div', 'att');
      m.attach.forEach(function (a) {
        if (a.dataUrl && isImg(a.mime, a.name)) {
          var im = el('img');
          im.src = a.dataUrl;
          im.title = a.name + '（点击放大）';
          im.addEventListener('click', function () { openLightbox(a.dataUrl); });
          box.appendChild(im);
        } else {
          box.appendChild(el('span', 'f', '📄 ' + a.name));
        }
      });
      bub.appendChild(box);
    }
    col.appendChild(bub);

    if (me && m.targets && m.targets.length) {
      var to = el('div', 'to');
      to.appendChild(el('span', 'ic', '→'));
      to.appendChild(el('span', null, m.targets.map(function (t) { return t.label; }).join('、')
        + (m.mode === 'sequential' ? '（顺序）' : '')));
      // 本次实际带了多少历史。ctxUsed 由服务端回填（它才知道真实条数：
      // 消息变少、被排除、记录被截断等情况都可能让实际值小于设定值）
      if (typeof m.ctxUsed === 'number') {
        var ctxTag = el('span', 'ctxtag', m.ctxUsed > 0 ? ('带 ' + m.ctxUsed + ' 条上文') : '未带上文');
        ctxTag.title = m.ctxUsed > 0
          ? '本条发送时附带了最近 ' + m.ctxUsed + ' 条记录'
          : '本条未附带历史记录（只发了内容本身）';
        to.appendChild(ctxTag);
      }
      col.appendChild(to);
    }

    // 悬停时出现的操作：引用 / 复制
    var acts = el('div', 'acts');
    var btnQ = el('button', null, '引用');
    btnQ.title = '引用这条消息（配合 @ 可精确指代）';
    btnQ.addEventListener('click', function (e) { e.stopPropagation(); setQuote(m); });
    acts.appendChild(btnQ);

    var btnC = el('button', null, '复制');
    btnC.title = '复制原文';
    btnC.addEventListener('click', function (e) {
      e.stopPropagation();
      copyText(m.text || '', btnC);
    });
    acts.appendChild(btnC);

    // acts 放在 col 之外：气泡宽度受限，按钮跟着气泡走会显得挤
    d.appendChild(col);
    d.appendChild(acts);
    return d;
  }

  /** 复制到剪贴板；失败时如实反馈（沙箱窗口可能没有 clipboard 权限） */
  function copyText(text, btn) {
    var done = function (ok) {
      if (!btn) return;
      var old = btn.textContent;
      btn.textContent = ok ? '已复制' : '复制失败';
      setTimeout(function () { btn.textContent = old; }, 1200);
    };
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () { done(true); }, function () { done(fallbackCopy(text)); });
        return;
      }
    } catch (e) { /* 落到下面的兜底 */ }
    done(fallbackCopy(text));
  }

  function fallbackCopy(text) {
    try {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      var ok = document.execCommand('copy');
      document.body.removeChild(ta);
      return !!ok;
    } catch (e) { return false; }
  }

  function openLightbox(src) {
    lightboxImg.src = src;
    lightbox.className = 'show';
  }
  lightbox.addEventListener('click', function () { lightbox.className = ''; lightboxImg.src = ''; });

  // ===================== 渲染：附件 =====================
  function renderAtts() {
    attsEl.textContent = '';
    state.attachments.forEach(function (a, i) {
      var d = el('div', 'at' + (a.status === 'sending' ? ' st' : ''));
      if (a.dataUrl && isImg(a.mime, a.name)) {
        var im = el('img');
        im.src = a.dataUrl;
        d.appendChild(im);
      } else {
        d.appendChild(el('span', null, '📄'));
      }
      var nm = el('span', 'nm', a.name);
      nm.title = a.name;
      d.appendChild(nm);
      d.appendChild(el('span', 'sz', fmtSize(a.size)));
      if (a.status !== 'sending') {
        var x = el('span', 'x', '✕');
        x.title = '移除';
        x.addEventListener('click', function () { state.attachments.splice(i, 1); renderAtts(); });
        d.appendChild(x);
      }
      attsEl.appendChild(d);
    });
  }

  function addFiles(files) {
    var arr = Array.prototype.slice.call(files || []);
    for (var i = 0; i < arr.length; i++) {
      (function (f) {
        if (f.size > MAX_ATTACH_MB * 1024 * 1024) {
          setError('「' + f.name + '」超过 ' + MAX_ATTACH_MB + 'MB 上限');
          renderStatus(); return;
        }
        var fr = new FileReader();
        fr.onload = function () {
          var s = String(fr.result);
          var k = s.indexOf(',');
          state.attachments.push({
            name: f.name || ('粘贴的图片.' + (f.type.split('/')[1] || 'png')),
            mime: f.type || 'application/octet-stream',
            size: f.size,
            data: k >= 0 ? s.slice(k + 1) : s,
            dataUrl: s,
            status: 'ready'
          });
          renderAtts();
        };
        fr.onerror = function () {
          // FileReader 失败常见于：文件在读取前被移走/删除、路径不可访问、
          // 或拖进来的是虚拟文件（如从压缩包里直接拖）。把原因说清楚，别只报"失败"。
          var why = '';
          try { why = (fr.error && fr.error.name) ? fr.error.name : ''; } catch (e) {}
          setError('读取「' + f.name + '」失败'
            + (why ? '（' + why + '）' : '')
            + '：文件可能已被移动或删除，或该位置不允许读取。可以改用 📎 按钮重新选择。');
          renderStatus();
        };
        fr.readAsDataURL(f);
      })(arr[i]);
    }
  }

  // ===================== @ 提及 =====================
  function openMention(query) {
    var list = [{ id: 'all', label: '全体', plat: '发给所有已勾选的人', hue: 212 }];
    var pool = targetList();
    if (!pool.length) pool = peers().filter(function (w) { return w.canInject; });
    pool.forEach(function (w) {
      list.push({
        id: String(w.windowId),
        label: w.title || w.providerId || ('窗口 ' + w.windowId),
        plat: w.providerId || '',
        hue: hueOf(w.windowId),
      });
    });
    if (query) {
      var q = query.toLowerCase();
      list = list.filter(function (x) {
        if (x.id === 'all') return '全体 all'.indexOf(q) >= 0 || query === '全' || query === '全体';
        return String(x.label).toLowerCase().indexOf(q) >= 0 || String(x.plat).toLowerCase().indexOf(q) >= 0;
      });
    }
    state.mention.items = list;
    state.mention.query = query || '';
    state.mention.idx = 0;
    state.mention.open = list.length > 0;
    renderMention();
  }

  function closeMention() {
    state.mention.open = false;
    mentionEl.className = '';
    mentionEl.textContent = '';
  }

  function renderMention() {
    if (!state.mention.open) { closeMention(); return; }
    mentionEl.textContent = '';
    mentionEl.appendChild(el('div', 'hd', state.mention.query
      ? ('匹配「' + state.mention.query + '」')
      : '↑↓ 选择 · Enter 确认 · Esc 取消'));
    state.mention.items.forEach(function (it, i) {
      var d = el('div', 'it' + (i === state.mention.idx ? ' sel' : ''));
      d.style.setProperty('--id-h', it.hue);
      d.appendChild(el('span', 'av', initialOf(it.label)));
      d.appendChild(el('span', null, it.label));
      d.appendChild(el('span', 'p', it.plat));
      d.addEventListener('mousedown', function (e) { e.preventDefault(); chooseMention(i); });
      mentionEl.appendChild(d);
    });
    mentionEl.className = 'show';
  }

  function detectMention() {
    var v = inputEl.value;
    var pos = inputEl.selectionStart;
    var before = v.slice(0, pos);
    var at = before.lastIndexOf('@');
    if (at < 0) { closeMention(); return; }
    var frag = before.slice(at + 1);
    if (/[\s\n]/.test(frag)) { closeMention(); return; }
    state.mention.at = at;
    openMention(frag);
  }

  function chooseMention(i) {
    var it = state.mention.items[i];
    if (!it) return;
    var v = inputEl.value;
    var at = state.mention.at;
    var pos = inputEl.selectionStart;
    var insert = '@' + it.label + ' ';
    inputEl.value = v.slice(0, at) + insert + v.slice(pos);
    var np = at + insert.length;
    try { inputEl.setSelectionRange(np, np); } catch (e) {}

    if (it.id === 'all') {
      peers().forEach(function (w) { if (w.canInject) state.selected[w.windowId] = true; });
    } else {
      peers().forEach(function (w) { state.selected[w.windowId] = false; });
      state.selected[Number(it.id)] = true;
    }
    closeMention();
    renderPeers(); renderSendTo();
  }

  // ===================== 流式输出（SSE） =====================
  /**
   * 用 EventSource 接服务端推送的增量文本。
   *
   * 为什么不用 fetch 流式读：EventSource 自带重连与事件分发，代码量小得多；
   * 代价是不能带自定义请求头，所以令牌走 query（页面从服务端拿到，不经第三方）。
   *
   * 连不上怎么办：不报错、不打断使用 —— 退回原来的 1.5 秒轮询（回复照样会到，
   * 只是没有打字机效果），并在顶栏用小圆点如实标出状态。
   */
  var es = null;
  var esRetry = null;

  function setSse(status, text) {
    state.sse = status;
    sseEl.className = status;
    sseTxt.textContent = text || (status === 'on' ? '实时' : status === 'off' ? '轮询' : '连接中');
    sseEl.title = status === 'on'
      ? '正在接收实时增量（打字机效果）'
      : '未连接实时通道，已退回轮询模式（回复仍会正常送达）';
  }

  function connectSse() {
    if (es) { try { es.close(); } catch (e) {} es = null; }
    if (typeof EventSource !== 'function') { setSse('off', '轮询'); return; }
    try {
      es = new EventSource('http://127.0.0.1:' + PORT + '/chat/events?t=' + encodeURIComponent(TOKEN));
    } catch (e) { setSse('off', '轮询'); return; }

    es.addEventListener('open', function () { setSse('on'); });

    es.addEventListener('hello', function () {
      setSse('on');
      // 服务端可能已经在推流（比如页面刚刷新），拉一次快照补上
      api('/chat/status').then(function (r) {
        if (r && r.streams) { state.streams = r.streams; renderMsgs(); }
      }, function () {});
    });

    es.addEventListener('stream-start', function (e) {
      var d = parseEv(e);
      if (!d) return;
      state.streams[d.windowId] = { text: '', label: d.label || '' };
      renderMsgs();
    });

    es.addEventListener('stream-delta', function (e) {
      var d = parseEv(e);
      if (!d) return;
      var s = state.streams[d.windowId];
      if (!s) { state.streams[d.windowId] = { text: d.text || '', label: '' }; }
      else { s.text = d.text || ''; }
      renderStreams();
    });

    es.addEventListener('stream-end', function (e) {
      var d = parseEv(e);
      if (!d) return;
      delete state.streams[d.windowId];
      // 关键：删除后必须重新跑一次 renderStreams 才会把气泡摘掉。
      // 只调 renderMsgs() 不行 —— 它只在"还有流"时才回头调 renderStreams。
      renderStreams();
      // 最终内容以 /chat/status 里落库的消息为准
      pullChat().then(function () { renderMsgs(); }, function () { renderMsgs(); });
    });

    es.addEventListener('error', function () {
      // EventSource 会自己重连；这里只更新指示，不弹错误横幅（不该打断使用）
      setSse('off', '轮询');
    });
  }

  function parseEv(e) {
    try { return JSON.parse(e.data); } catch (_) { return null; }
  }

  /** 只更新正在流式的气泡内容，不重建整棵 DOM（否则光标闪烁、滚动会跳） */
  function renderStreams() {
    var stick = msgsEl.scrollTop + msgsEl.clientHeight >= msgsEl.scrollHeight - 90;
    var ids = Object.keys(state.streams);

    // 先摘掉已经没有对应流的节点。
    // 直接遍历 children 而不用 querySelectorAll：少一层选择器依赖，行为更可预期。
    var kids = Array.prototype.slice.call(msgsEl.children || []);
    for (var i = 0; i < kids.length; i++) {
      var n = kids[i];
      if (!n.getAttribute || n.className.indexOf('streaming') < 0) continue;
      if (ids.indexOf(String(n.getAttribute('data-wid'))) < 0) n.remove();
    }

    for (var k = 0; k < ids.length; k++) {
      var wid = ids[k];
      var st = state.streams[wid];
      var node = findByWid(wid);
      if (!node) {
        node = buildStreamingNode(wid, st);
        msgsEl.appendChild(node);
        // 流式气泡出现时，把"等待"占位收起来，避免同一个人出现两个气泡
        var r = msgsEl.querySelector('.running');
        if (r) r.remove();
      }
      var body = queryIn(node, 'stream-body');
      if (body) {
        body.textContent = st.text || '';
        var dots = queryIn(node, 'stream-dots');
        if (dots) dots.style.display = st.text ? 'none' : '';
      }
    }
    if (stick) msgsEl.scrollTop = msgsEl.scrollHeight;
  }

  /** 在子树里找第一个带指定 class 的元素（不依赖 querySelector 的选择器实现） */
  function queryIn(root, cls) {
    var kids = Array.prototype.slice.call(root.children || []);
    for (var i = 0; i < kids.length; i++) {
      if (kids[i].className && kids[i].className.split(/\s+/).indexOf(cls) >= 0) return kids[i];
      var deep = queryIn(kids[i], cls);
      if (deep) return deep;
    }
    return null;
  }

  function findByWid(wid) {
    var all = msgsEl.children || [];
    for (var i = 0; i < all.length; i++) {
      if (all[i].getAttribute && all[i].getAttribute('data-wid') === String(wid)) return all[i];
    }
    return null;
  }

  function buildStreamingNode(wid, st) {
    var d = el('div', 'ev ai streaming');
    d.setAttribute('data-wid', String(wid));
    d.style.setProperty('--id-h', hueOf(wid));
    d.appendChild(el('div', 'av', initialOf(st.label)));
    var col = el('div', 'col');
    var hd = el('div', 'hd');
    hd.appendChild(el('span', 'who', st.label || ('窗口 ' + wid)));
    hd.appendChild(el('span', 'tm', '生成中'));
    col.appendChild(hd);
    var bub = el('div', 'bub');
    var body = el('span', 'stream-body', st.text || '');
    var dots = el('span', 'stream-dots');
    dots.appendChild(el('i')); dots.appendChild(el('i')); dots.appendChild(el('i'));
    bub.appendChild(body);
    bub.appendChild(dots);
    bub.appendChild(el('span', 'cursor'));
    col.appendChild(bub);
    d.appendChild(col);
    return d;
  }

  // ===================== 引用 =====================
  /**
   * 引用一条消息。配合 @ 使用：@ 决定"发给谁"，引用决定"针对哪条"。
   *
   * 只记 id + 快照；原文由后端按 id 从记录里查（最准），
   * 查不到才退回快照（记录被清空/截断时仍能用）。
   */
  function setQuote(m) {
    if (!m) { clearQuote(); return; }
    var snap = String(m.text || '');
    state.quote = {
      id: m.id,
      who: m.who || (m.role === 'user' ? '我' : 'AI'),
      text: snap.length > 200 ? (snap.slice(0, 200) + '…') : snap,
    };
    renderQuoteBar();
    try { inputEl.focus(); } catch (e) {}
  }

  function clearQuote() {
    state.quote = null;
    renderQuoteBar();
  }

  function renderQuoteBar() {
    var q = state.quote;
    if (!q) { quoteBar.className = ''; quoteWho.textContent = ''; quoteText.textContent = ''; return; }
    quoteBar.className = 'show';
    quoteWho.textContent = '回复 ' + q.who;
    quoteText.textContent = q.text;
  }

  quoteX.addEventListener('click', clearQuote);

  /** 滚到某条消息并闪一下（点引用块时用） */
  function jumpTo(id) {
    var node = findById(id);
    if (!node) return;
    try { node.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (e) {
      try { msgsEl.scrollTop = node.offsetTop - 80; } catch (e2) {}
    }
    node.className += ' flash';
    setTimeout(function () {
      node.className = node.className.replace(/\s*flash/, '');
    }, 1200);
  }

  function findById(id) {
    var kids = Array.prototype.slice.call(msgsEl.children || []);
    for (var i = 0; i < kids.length; i++) {
      if (kids[i].getAttribute && kids[i].getAttribute('data-mid') === String(id)) return kids[i];
    }
    return null;
  }

  // ===================== 话题 =====================
  /** 当前话题下的消息（界面只显示这些） */
  function topicMessages() {
    var all = (state.chat && state.chat.messages) || [];
    if (!state.activeTopic) return all;
    return all.filter(function (m) { return !m.topic || m.topic === state.activeTopic; });
  }

  function currentTopic() {
    for (var i = 0; i < state.topics.length; i++) {
      if (state.topics[i].id === state.activeTopic) return state.topics[i];
    }
    return null;
  }

  function renderTopicBtn() {
    var t = currentTopic();
    topicNameEl.textContent = t ? t.title : '默认';
    topicBtn.title = '当前话题：' + (t ? t.title : '默认') + '（不同话题的历史互不相通）';
  }

  function renderTopicMenu() {
    topicMenu.textContent = '';
    var all = (state.chat && state.chat.messages) || [];
    state.topics.forEach(function (t) {
      var row = el('div', 'ti' + (t.id === state.activeTopic ? ' act' : ''));
      row.appendChild(el('span', 'tn', t.title));
      var n = all.filter(function (m) { return m.topic === t.id; }).length;
      row.appendChild(el('span', 'cnt', n ? String(n) : ''));
      row.addEventListener('click', function (e) {
        if (e.target && e.target.className && e.target.className.indexOf('mini') >= 0) return;
        switchTopic(t.id);
      });

      // 重命名：就地换成输入行，不用 prompt（Electron 不支持）
      var ren = el('span', 'mini', '✎');
      ren.title = '重命名';
      ren.addEventListener('click', function (e) {
        e.stopPropagation();
        showInlineInput('重命名话题', t.title, function (val) {
          api('/topic/rename', { method: 'POST', body: { id: t.id, title: val } })
            .then(applyTopicState).then(function () { renderTopicMenu(); }, function () {});
        });
      });
      row.appendChild(ren);

      if (state.topics.length > 1) {
        var del = el('span', 'mini del', '✕');
        del.title = '删除这个话题（连同它的 ' + n + ' 条消息）';
        del.addEventListener('click', function (e) {
          e.stopPropagation();
          askConfirm('删除话题',
            '「' + t.title + '」下的 ' + n + ' 条消息会一起删掉，不可恢复。')
            .then(function (ok) {
              if (!ok) return;
              return api('/topic/delete', { method: 'POST', body: { id: t.id } })
                .then(applyTopicState).then(function () {
                  closeTopicMenu();
                  msgsEl.textContent = '';
                  state.lastCount = 0;
                  return refresh();
                }, function () {});
            });
        });
        row.appendChild(del);
      }
      topicMenu.appendChild(row);
    });

    topicMenu.appendChild(el('div', 'sep'));
    var add = el('div', 'new', '＋ 新建话题');
    add.addEventListener('click', function () {
      showInlineInput('新话题名称', '话题 ' + (state.topics.length + 1), function (val) {
        api('/topic/create', { method: 'POST', body: { title: val } })
          .then(applyTopicState).then(function () {
            closeTopicMenu();
            msgsEl.textContent = '';
            state.lastCount = 0;
            return refresh();
          }, function () {});
      });
    });
    topicMenu.appendChild(add);
  }

  /**
   * 在菜单里就地显示一行输入，替代 window.prompt。
   *
   * 为什么必须替代：Electron 的渲染进程**禁用了 window.prompt**
   * （调用会抛 "prompt() is and will not be supported"），
   * 所以原来点「新建话题」根本不会有任何反应。
   */
  function showInlineInput(placeholder, value, onOk) {
    var old = topicMenu.querySelector('.inline');
    if (old) old.remove();
    var box = el('div', 'inline');
    var inp = el('input');
    inp.type = 'text';
    inp.placeholder = placeholder;
    inp.value = value || '';
    var ok = el('button', 'pri', '确定');
    var submit = function () {
      var v = String(inp.value || '').trim();
      if (!v) { try { inp.focus(); } catch (e) {} return; }
      onOk(v);
    };
    ok.addEventListener('click', function (e) { e.stopPropagation(); submit(); });
    inp.addEventListener('click', function (e) { e.stopPropagation(); });
    inp.addEventListener('keydown', function (e) {
      e.stopPropagation();
      if (e.key === 'Enter') { e.preventDefault(); submit(); }
      if (e.key === 'Escape') { e.preventDefault(); box.remove(); }
    });
    box.appendChild(inp);
    box.appendChild(ok);
    topicMenu.insertBefore(box, topicBtnMarker());
    try { inp.focus(); inp.select(); } catch (e) {}
  }
  /** 输入行插到「新建」之前：找那个 new 节点当锚 */
  function topicBtnMarker() {
    var kids = topicMenu.children || [];
    for (var i = 0; i < kids.length; i++) {
      if (kids[i].className === 'new') return kids[i];
    }
    return null;
  }

  /** 把接口返回的话题状态写进本地 */
  function applyTopicState(r) {
    if (!r) return;
    if (Array.isArray(r.topics)) state.topics = r.topics;
    if (typeof r.activeTopic === 'string') state.activeTopic = r.activeTopic;
    renderTopicBtn();
  }

  function switchTopic(id) {
    if (id === state.activeTopic) { closeTopicMenu(); return; }
    api('/topic/active', { method: 'POST', body: { id: id } }).then(applyTopicState).then(function () {
      closeTopicMenu();
      // 换话题等于换一屏内容：清掉已渲染标记并重绘
      msgsEl.textContent = '';
      state.lastCount = 0;
      // 搜索结果是针对上一话题的，必须清掉，否则会指向已不在 DOM 的节点
      closeSearch();
      return refresh();
    }, function () {});
  }

  function closeTopicMenu() { topicMenu.className = ''; }

  /** 把 fixed 定位的菜单对齐到按钮下方（不出屏、不被裁切） */
  function positionTopicMenu() {
    var r = topicBtn.getBoundingClientRect();
    var vw = window.innerWidth || 1200;
    var vh = window.innerHeight || 800;
    var w = topicMenu.offsetWidth || 240;
    var h = topicMenu.offsetHeight || 200;
    // 左对齐按钮，但别超出右边界
    var left = r.left;
    if (left + w > vw - 8) left = Math.max(8, vw - w - 8);
    var top = r.bottom + 6;
    // 下面放不下就翻到上面
    if (top + h > vh - 8) top = Math.max(8, r.top - h - 6);
    topicMenu.style.left = Math.round(left) + 'px';
    topicMenu.style.top = Math.round(top) + 'px';
  }

  topicBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    if (topicMenu.className.indexOf('show') >= 0) { closeTopicMenu(); return; }
    renderTopicMenu();
    topicMenu.className = 'show';
    positionTopicMenu();
  });
  document.addEventListener('click', function () { closeTopicMenu(); });
  topicMenu.addEventListener('click', function (e) { e.stopPropagation(); });
  // 窗口尺寸变化时菜单会错位，直接收起（重新打开会重新定位）
  window.addEventListener('resize', function () { closeTopicMenu(); });

  // ===================== 消息搜索 =====================
  /**
   * 只搜当前话题。跨话题搜会把别的议题混进来，反而更难找。
   * 命中用两类标记：hit（候选）与 hit-cur（当前定位），配合 ↑↓ 循环跳。
   */
  function openSearch() {
    state.search.open = true;
    searchBarEl.className = 'show';
    try { searchInput.focus(); searchInput.select(); } catch (e) {}
    runSearch(state.search.q);
  }

  function closeSearch() {
    state.search.open = false;
    searchBarEl.className = '';
    state.search.hits = [];
    state.search.cur = -1;
    clearMarks();
    renderSearchCount();
  }

  function clearMarks() {
    var kids = Array.prototype.slice.call(msgsEl.children || []);
    for (var i = 0; i < kids.length; i++) {
      var n = kids[i];
      if (!n.className) continue;
      n.className = n.className.replace(/\s*(hit|hit-cur)\b/g, '');
      // 还原被高亮的文本
      var marks = [];
      (function w(x) {
        for (var j = 0; j < (x.children || []).length; j++) {
          var c = x.children[j];
          if (c.tagName === 'MARK') marks.push(c); else w(c);
        }
      })(n);
      for (var k = 0; k < marks.length; k++) {
        var m = marks[k];
        if (m.parentNode) {
          var txt = document.createTextNode(m.textContent || '');
          m.parentNode.replaceChild(txt, m);
        }
      }
    }
  }

  /** 在元素子树里把匹配文本包成 <mark>（不碰已在 mark 里的） */
  function highlightIn(root, q) {
    if (!q) return;
    var lower = q.toLowerCase();
    var kids = Array.prototype.slice.call(root.children || []);
    for (var i = 0; i < kids.length; i++) {
      var c = kids[i];
      if (c.tagName === 'MARK') continue;
      if (c.children && c.children.length) { highlightIn(c, q); continue; }
      var t = c.textContent || '';
      var idx = t.toLowerCase().indexOf(lower);
      if (idx < 0) continue;
      // 只处理第一个匹配，避免在循环里改结构
      var frag = document.createDocumentFragment();
      if (idx > 0) frag.appendChild(document.createTextNode(t.slice(0, idx)));
      var mk = document.createElement('mark');
      mk.className = 'hl';
      mk.textContent = t.substr(idx, q.length);
      frag.appendChild(mk);
      if (idx + q.length < t.length) frag.appendChild(document.createTextNode(t.slice(idx + q.length)));
      c.textContent = '';
      c.appendChild(frag);
    }
  }

  function runSearch(q) {
    state.search.q = q || '';
    clearMarks();
    state.search.hits = [];
    state.search.cur = -1;
    if (!state.search.q) { renderSearchCount(); return; }

    var kw = state.search.q.toLowerCase();
    // 只搜当前话题的、可见的消息节点
    var kids = Array.prototype.slice.call(msgsEl.children || []);
    for (var i = 0; i < kids.length; i++) {
      var n = kids[i];
      if (!n.getAttribute || !n.getAttribute('data-mid')) continue;
      var text = (n.textContent || '').toLowerCase();
      if (text.indexOf(kw) < 0) continue;
      state.search.hits.push(n);
      n.className = n.className + ' hit';
      highlightIn(n, state.search.q);
    }
    if (state.search.hits.length) {
      state.search.cur = 0;
      focusHit(0);
    }
    renderSearchCount();
  }

  function focusHit(i) {
    var hits = state.search.hits;
    if (!hits.length) return;
    var idx = ((i % hits.length) + hits.length) % hits.length;
    state.search.cur = idx;
    for (var k = 0; k < hits.length; k++) {
      hits[k].className = hits[k].className.replace(/\s*hit-cur\b/g, '');
    }
    var node = hits[idx];
    node.className = node.className + ' hit-cur';
    try { node.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (e) {
      try { msgsEl.scrollTop = Math.max(0, node.offsetTop - 100); } catch (e2) {}
    }
    renderSearchCount();
  }

  function renderSearchCount() {
    var n = state.search.hits.length;
    if (!state.search.q) { searchCountEl.textContent = ''; return; }
    searchCountEl.textContent = n ? ((state.search.cur + 1) + ' / ' + n) : '无匹配';
  }

  btnSearch.addEventListener('click', function () {
    if (state.search.open) closeSearch(); else openSearch();
  });
  searchClose.addEventListener('click', closeSearch);
  searchInput.addEventListener('input', function () { runSearch(searchInput.value.trim()); });
  searchInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      if (e.shiftKey) focusHit(state.search.cur - 1); else focusHit(state.search.cur + 1);
    }
    if (e.key === 'Escape') { e.preventDefault(); closeSearch(); }
  });
  searchNext.addEventListener('click', function () { focusHit(state.search.cur + 1); });
  searchPrev.addEventListener('click', function () { focusHit(state.search.cur - 1); });
  // 全局快捷键：Ctrl+F 打开搜索
  document.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && (e.key === 'f' || e.key === 'F')) {
      e.preventDefault();
      openSearch();
    }
  });

  // ===================== 接力 =====================
  /**
   * 接力开关。
   *
   * 默认关：开启后一次发言可能连发好几条调用，得让人主动选。
   * 关掉时成员仍能看到彼此的名字（协作说明照发），只是 @ 不会转发。
   */
  function setRelay(on) {
    state.relay = !!on;
    relaySw.className = state.relay ? 'on' : '';
    relayWrap.title = state.relay
      ? '接力已开启：AI 回复里 @ 别人会自动转发给对方（最多 3 跳）'
      : '接力已关闭：@ 不会自动转发。点这里开启';
    return api('/relay', { method: 'POST', body: { on: state.relay } }).catch(function () {});
  }

  relayWrap.addEventListener('click', function () { setRelay(!state.relay); });

  /** 从服务端同步接力状态（别的窗口可能改过） */
  function pullRelay() {
    return api('/relay/status').then(function (r) {
      if (r && typeof r.relay === 'boolean' && r.relay !== state.relay) setRelay(r.relay);
    }, function () {});
  }

  // ===================== 分工讨论 =====================
  /**
   * 三阶段：各自提案 → 交叉评议 → 合成分工表。
   *
   * 成本必须在开始前显示：3 位成员 = 7 次调用、好几分钟。
   * 让人点了才知道要等多久，是最糟的体验。
   */
  function openPlan() {
    planBar.className = 'show';
    updatePlanCost();
    try { planTask.focus(); } catch (e) {}
  }
  function closePlan() { planBar.className = ''; }

  function updatePlanCost() {
    var n = targetList().length;
    if (!n) { planCost.textContent = '还没有选中成员'; return; }
    var calls = n * 2 + 1;
    var mins = Math.max(1, Math.round(calls * 0.5));
    planCost.textContent = n + ' 位成员 × 3 阶段 = ' + calls + ' 次调用，约 ' + mins + ' 分钟';
  }

  btnPlan.addEventListener('click', function () {
    if (planBar.className.indexOf('show') >= 0) closePlan(); else openPlan();
  });
  planCancel.addEventListener('click', closePlan);

  planGo.addEventListener('click', function () {
    var task = String(planTask.value || '').trim();
    if (!task) { setError('请先写清要做什么'); return; }
    var t = targetList();
    if (!t.length) { setError('没有可用的对话对象'); return; }

    if (!window.confirm) { /* 见下方 askConfirm：这里改用自家确认框 */ }
    askConfirm('开始分工讨论',
      '将要进行：' + t.length + ' 位成员 × 3 阶段。\n'
      + '每个人的原文都会记在这里，你随时可以停止。\n\n'
      + '注意：这只会生成分工表，不会自动改动任何文件。')
      .then(function (ok) {
        if (!ok) return;
        setError('');
        planGo.disabled = true;
        api('/plan/start', { method: 'POST', body: { task: task, synth: t[0].windowId } })
          .then(function (r) {
            planGo.disabled = false;
            if (!r || !r.ok) { setError((r && r.error) || '启动失败'); return; }
            closePlan();
            planProg.className = 'show';
            planStageEl.textContent = '各自提案';
            planBarFill.style.width = '0%';
            planCount.textContent = '0 / ' + (r.totalCalls || '?');
            startPlanPoll();
          }, function (e) {
            planGo.disabled = false;
            setError('启动失败：' + ((e && e.message) || e));
          });
      });
  });

  var planTimer = null;
  function startPlanPoll() {
    if (planTimer) return;
    planTimer = setInterval(function () {
      api('/plan/status').then(function (s) {
        if (!s || !s.running) {
          stopPlanPoll();
          planProg.className = '';
          refresh();
          return;
        }
        planStageEl.textContent = s.stageName || ('第 ' + s.stage + ' 步');
        var pct = s.total ? Math.round((s.done / s.total) * 100) : 0;
        planBarFill.style.width = Math.max(6, Math.min(100, pct)) + '%';
        planCount.textContent = s.done + ' / ' + s.total;
      }, function () {});
    }, 900);
  }
  function stopPlanPoll() {
    if (planTimer) { clearInterval(planTimer); planTimer = null; }
  }

  planStopBtn.addEventListener('click', function () {
    planStopBtn.textContent = '停止中…';
    api('/plan/stop', { method: 'POST' }).then(function () {
      planStopBtn.textContent = '停止';
      stopPlanPoll();
      planProg.className = '';
      setError('已发送停止请求：正在进行的调用会跑完，之后不再继续');
      refresh();
    }, function () { planStopBtn.textContent = '停止'; });
  });

  // ===================== 文件占用（防撞车） =====================
  /**
   * 显示当前被占用的文件数。
   *
   * 注意：这是**可见性**，不是锁。插件层没有工具执行前的拦截钩子，
   * 拦不住 AI 去写。它的作用是让用户和 AI 都知道"谁在动什么"，
   * 冲突时能及时发现并协调。
   */
  function pullClaims() {
    return api('/claims/status').then(function (r) {
      var n = (r && r.claims && r.claims.length) || 0;
      claimN.textContent = String(n);
      // 注意：claimWrap 现在是菜单项，别覆盖它的 class（会丢掉 .mi 样式）
      claimN.style.color = n > 0 ? 'var(--warn)' : '';
      claimWrap.title = n > 0
        ? n + ' 个文件最近被改动过（点击看详情，' + (r.ttlMin || 30) + ' 分钟后自动释放）'
        : '当前没有文件被占用';
      // 有占用时在「⋯」上加个小圆点，否则收起后完全看不见
      btnMore.className = 'icon' + (n > 0 ? ' hasdot' : '');
      state.claims = (r && r.claims) || [];
    }, function () {});
  }

  claimWrap.addEventListener('click', function () {
    closeMoreMenu();
    var cs = state.claims || [];
    if (!cs.length) { setError('当前没有文件被占用'); return; }
    askConfirm('当前被改动的文件',
      cs.map(function (c) {
        return '· ' + c.path + '\n   被 ' + (c.holders || []).join('、') + ' 动过';
      }).join('\n\n')
      + '\n\n这只是提示，不会阻止任何操作。要避免撞车，'
      + '请在发任务时说明清楚谁负责哪些文件。')
      .then(function () {});
  });

  // ===================== 状态 =====================
  function renderStatus() {
    var busy = (state.chat.busy || []).length;
    var working = !!(state.chat.sending || busy);
    dot.className = state.alive ? (working ? 'run' : 'on') : 'err';
    if (!state.alive) {
      statusEl.className = 'bad';
      statusEl.textContent = state.error || '未连接主进程服务';
    } else if (state.error) {
      statusEl.className = 'bad';
      statusEl.textContent = state.error;
    } else if (busy) {
      statusEl.className = '';
      statusEl.textContent = '等待 ' + busy + ' 位回复…';
    } else if (state.chat.sending) {
      statusEl.className = '';
      statusEl.textContent = '正在发送…';
    } else {
      statusEl.className = '';
      statusEl.textContent = '就绪';
    }
    btnSend.disabled = !state.alive;
    var t = targetList();
    var n = (state.chat.messages || []).length;
    footEl.textContent = '已选 ' + t.length + ' 位 · ' + n + ' 条记录 · 端口 ' + PORT;
  }

  function applyTheme(scheme) {
    if (scheme !== 'light' && scheme !== 'dark') return;
    if (state.theme === scheme) return;
    state.theme = scheme;
    document.documentElement.className = (scheme === 'light' ? 'light' : '');
  }

  function renderAll() { renderPeers(); renderSendTo(); renderMsgs(); renderAtts(); renderStatus(); }

  // ===================== 拉取 =====================
  function pullStatus() {
    return api('/status').then(function (r) {
      state.alive = true;
      state.windows = r.windows || [];
      if (r.port) PORT = r.port;
      if (r.theme) applyTheme(r.theme);
      if (!Object.keys(state.selected).length) {
        peers().forEach(function (w) { if (w.canInject) state.selected[w.windowId] = true; });
      }
    }, function (e) {
      state.alive = false;
      state.error = '连不上主进程服务（端口 ' + PORT + '）：' + ((e && e.message) || e)
        + ' —— 若刚装好插件，请重启 Cuckoo';
      state.windows = [];
    });
  }
  function pullChat() {
    return api('/chat/status').then(function (r) {
      state.chat = r.chat || state.chat;
      state.alive = true;
      // 话题列表由服务端权威下发（它是唯一知道全量消息归属的地方）
      if (Array.isArray(r.chat && r.chat.topics)) state.topics = r.chat.topics;
      if (typeof (r.chat || {}).activeTopic === 'string') {
        var prev = state.activeTopic;
        state.activeTopic = r.chat.activeTopic;
        // 别处（比如另一个窗口）切了话题，这边要跟着换屏
        if (prev && prev !== state.activeTopic) {
          msgsEl.textContent = '';
          state.lastCount = 0;
        }
      }
      renderTopicBtn();
    }, function () {});
  }
  function refresh() {
    return pullStatus().then(pullChat).then(pullClaims).then(renderAll, renderAll);
  }

  // ===================== 发送 =====================
  function send() {
    var text = inputEl.value.trim();
    if (!text && !state.attachments.length) return;
    if (!text && state.attachments.length) text = '（请查看附件）';
    var t = targetList();
    if (!t.length) { setError('没有可用的对话对象：请打开至少一个 AI 平台窗口'); renderStatus(); return; }

    var payload = {
      text: text,
      targets: t.map(function (w) { return w.windowId; }),
      mode: state.mode,
      // 发到当前话题
      topic: state.activeTopic,
      // 接力开关：开启后成员回复里 @ 别人会自动转发
      relay: state.relay,
      // 本次带多少历史（0 = 不带）。服务端会回填实际条数到消息的 ctxUsed
      contextLimit: state.ctxLimit,
      // 引用的原文由后端按 id 从记录里查；这里只传 id 与快照兜底
      quote: state.quote ? { id: state.quote.id, who: state.quote.who, text: state.quote.text } : null,
      files: state.attachments.map(function (a) {
        return { name: a.name, mime: a.mime, data: a.data };
      })
    };

    setError('');
    btnSend.disabled = true;
    btnSend.className = 'sendbtn busy';

    api('/chat/send', { method: 'POST', body: payload }).then(function (r) {
      if (!r || !r.ok) { setError((r && r.error) || '发送失败'); return; }
      if (r.failed && r.failed.length) {
        setError('有 ' + r.failed.length + ' 个附件未上传成功，文字已发出。'
          + r.failed.map(function (f) {
              return '「' + f.name + '」' + (f.target ? ('→' + f.target) : '') + '：' + f.error;
            }).join('；'));
      }
      inputEl.value = '';
      inputEl.style.height = 'auto';
      state.attachments = [];
      clearQuote();          // 发送成功才清引用；失败时保留，方便直接重试
      renderAtts();
      return refresh();
    }, function (e) {
      setError('发送失败：' + ((e && e.message) || e) + '（若服务未启动，请重启 Cuckoo 让插件重新加载）');
    }).then(function () {
      btnSend.disabled = false;
      btnSend.className = 'sendbtn';
      renderStatus();
    });
  }

  // ===================== 事件 =====================
  btnSend.addEventListener('click', send);

  inputEl.addEventListener('input', function () {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(200, inputEl.scrollHeight) + 'px';
    detectMention();
  });

  inputEl.addEventListener('keydown', function (e) {
    if (state.mention.open) {
      if (e.key === 'ArrowDown') { e.preventDefault(); state.mention.idx = (state.mention.idx + 1) % state.mention.items.length; renderMention(); return; }
      if (e.key === 'ArrowUp') { e.preventDefault(); state.mention.idx = (state.mention.idx - 1 + state.mention.items.length) % state.mention.items.length; renderMention(); return; }
      if (e.key === 'Enter' || e.key === 'Tab') { e.preventDefault(); chooseMention(state.mention.idx); return; }
      if (e.key === 'Escape') { e.preventDefault(); closeMention(); return; }
    }
    // Esc 取消引用（有引用时才拦，免得影响其它场景）
    if (e.key === 'Escape' && state.quote) { e.preventDefault(); clearQuote(); return; }
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      send();
    }
  });

  inputEl.addEventListener('paste', function (e) {
    var items = (e.clipboardData && e.clipboardData.items) || [];
    var files = [];
    for (var i = 0; i < items.length; i++) {
      if (items[i].kind === 'file') {
        var f = items[i].getAsFile();
        if (f) files.push(f);
      }
    }
    if (files.length) { e.preventDefault(); addFiles(files); }
  });

  btnAttach.addEventListener('click', function () { filePick.click(); });
  filePick.addEventListener('change', function () { addFiles(filePick.files); filePick.value = ''; });

  var dragDepth = 0;
  window.addEventListener('dragenter', function (e) {
    if (!e.dataTransfer || Array.prototype.indexOf.call(e.dataTransfer.types || [], 'Files') < 0) return;
    e.preventDefault(); dragDepth++; dropEl.className = 'show';
  });
  window.addEventListener('dragover', function (e) {
    if (e.dataTransfer && Array.prototype.indexOf.call(e.dataTransfer.types || [], 'Files') >= 0) e.preventDefault();
  });
  window.addEventListener('dragleave', function () {
    dragDepth = Math.max(0, dragDepth - 1);
    if (!dragDepth) dropEl.className = '';
  });
  window.addEventListener('drop', function (e) {
    e.preventDefault(); dragDepth = 0; dropEl.className = '';
    if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) addFiles(e.dataTransfer.files);
  });

  // ===================== 更多菜单 =====================
  // 低频操作收进来，顶栏才能呼吸。用的还是固定定位，避免被 header 裁切。
  function closeMoreMenu() { moreMenu.className = ''; }
  function openMoreMenu() {
    moreMenu.className = 'show';
    var r = btnMore.getBoundingClientRect();
    var vw = window.innerWidth || 1200;
    var w = moreMenu.offsetWidth || 190;
    var h = moreMenu.offsetHeight || 120;
    var left = r.right - w;
    if (left < 8) left = 8;
    var top = r.bottom + 6;
    if (top + h > (window.innerHeight || 800) - 8) top = Math.max(8, r.top - h - 6);
    moreMenu.style.left = Math.round(left) + 'px';
    moreMenu.style.top = Math.round(top) + 'px';
  }
  btnMore.addEventListener('click', function (e) {
    e.stopPropagation();
    if (moreMenu.className.indexOf('show') >= 0) { closeMoreMenu(); return; }
    openMoreMenu();
  });
  document.addEventListener('click', function () { closeMoreMenu(); });
  moreMenu.addEventListener('click', function (e) { e.stopPropagation(); });

  miRefresh.addEventListener('click', function () { closeMoreMenu(); refresh(); });
  // 动作开关：默认关。打开后重绘，把动作补进聊天流。
  miAction.addEventListener('click', function () {
    state.showAction = !state.showAction;
    try { localStorage.setItem(ACTION_KEY, state.showAction ? '1' : '0'); } catch (e) {}
    actionState.textContent = state.showAction ? '开' : '关';
    closeMoreMenu();
    msgsEl.textContent = '';
    state.seen = {};
    state.lastCount = 0;
    refresh();
  });
  miClear.addEventListener('click', function () {
    closeMoreMenu();
    var t = currentTopic();
    // 有了话题隔离后，清空只清当前话题 —— 清全部会误伤其它话题，太危险。
    askConfirm('清空当前话题',
      '「' + (t ? t.title : '默认') + '」的消息会被清空，其它话题不受影响。\n'
      + '清空后 20 秒内可以点状态栏的「撤回」恢复。')
      .then(function (ok) {
        if (!ok) return;
        return api('/chat/clear', {
          method: 'POST',
          body: { topic: state.activeTopic, confirm: true },
        }).then(function (r) {
          msgsEl.textContent = '';
          state.lastCount = 0;
          // 服务端把删掉的消息存进了回收站，这里给一个可撤回的窗口
          if (r && r.restorable) offerUndo(r.cleared);
          return refresh();
        }, function () { refresh(); });
      });
  });

  /**
   * 清空后的撤回提示。
   *
   * 为什么需要：清空是不可逆的破坏性操作，而它曾经毫无防护
   * （任何请求一到达就执行）。现在服务端会留回收站，
   * 这里给 20 秒窗口让人反悔。
   */
  var undoMsg = null;
  function offerUndo(n) {
    if (undoMsg) { try { undoMsg.remove(); } catch (e) {} undoMsg = null; }
    var bar = el('div', 'undo');
    bar.appendChild(el('span', null, '已清空 ' + n + ' 条消息'));
    var b = el('button', null, '撤回');
    b.addEventListener('click', function () {
      api('/chat/restore', { method: 'POST' }).then(function (r) {
        if (r && r.ok) {
          msgsEl.textContent = '';
          state.lastCount = 0;
          setError('');
        } else {
          setError('撤回失败：' + ((r && r.error) || '没有可恢复的内容'));
        }
        clearUndo();
        return refresh();
      }, function () {});
    });
    var x = el('span', 'x', '✕');
    x.addEventListener('click', clearUndo);
    bar.appendChild(b);
    bar.appendChild(x);
    document.body.appendChild(bar);
    undoMsg = bar;
    setTimeout(clearUndo, 20000);
  }
  function clearUndo() {
    if (!undoMsg) return;
    try { undoMsg.remove(); } catch (e) {}
    undoMsg = null;
  }

  // ===================== 轮询 =====================
  applyTheme('dark');
  state.ctxLimit = loadCtxLimit();
  state.mode = loadMode();
  // 动作显示开关：默认关，记住上次选择
  try { state.showAction = localStorage.getItem(ACTION_KEY) === '1'; } catch (e) { state.showAction = false; }
  if (actionState) actionState.textContent = state.showAction ? '开' : '关';
  // 接力默认关；启动时问一下服务端（可能上次开着）
  setRelay(false);
  pullRelay();
  // 页面加载时若 marked 缺席（静态 <script> 拉取失败/服务未就绪），立刻补一次
  ensureMarked();
  refresh().then(function () {
    // 首次拿到端口后立刻接 SSE（端口可能被换过，所以放在 refresh 之后）
    connectSse();
  });

  /**
   * 轮询节奏：固定 1.5 秒。
   *
   * 曾经想过"SSE 连上就放慢"，但那会引入一类难查的延迟——比如切主题要等 5 秒才变。
   * 本地 loopback 上一次 /status 的代价可以忽略，可预期比省这点开销重要得多。
   * SSE 的职责是让流式输出顺滑，不是替代轮询。
   */
  function tick() {
    pullStatus().then(pullChat).then(function () {
      renderPeers(); renderSendTo(); renderMsgs(); renderStatus();
    }, function () {}).then(function () {
      setTimeout(tick, 1500);
    });
  }
  setTimeout(tick, 1500);
})();
</script>
</body>
</html>
